<style id="css">

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.page{max-width:880px;margin:0 auto;padding:clamp(24px,5vw,56px) clamp(16px,4vw,40px) 64px}

h2{font-size:1.45rem;font-weight:800;margin:40px 0 10px;padding-top:16px;border-top:1px solid var(--line)}

p{margin:0 0 .9em;max-width:70ch}

.meta{font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.lede{font-size:1.1rem;color:var(--ink-2);margin-top:12px}

.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 16px;font-size:.98rem}

/* property cards */
.props{display:flex;flex-direction:column;gap:12px;margin:10px 0 6px}
h4.subhead{font-family:var(--display);font-size:1rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:18px 0 0;padding:8px 14px;border-radius:8px 8px 0 0;display:flex;align-items:baseline;gap:10px}

.props.rent{border-left:4px solid var(--accent);padding-left:10px;margin-top:0}

.prop .head{grid-column:1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}

.pill.new{background:var(--accent-soft);color:var(--accent)} .pill.active{background:var(--good-soft);color:var(--good)} .pill.watching{background:var(--warn-soft);color:var(--warn)} .pill.dropped{background:var(--bad-soft);color:var(--bad)}

.small{font-size:.85rem;color:var(--ink-3)}

 basement kitchen before appraisal? 5) Are any rents actual leases?", "offer": "Open at $665,000 with the full 6% credit (≈ $39.9k to closing + 2–3 discount points). Walk-away $715,000 with the credit. Contingencies: city confirmation of two legal units, FHA appraisal as a two-unit, inspection with sewer scope.", "note": "My #1. Deep dive 2026-09-10: the basement can never be a legal third unit (R-1-5000; SLC and Utah ADU rules only cover single-family homes), so it has to be genuinely part of my unit. That's fine for me since I want two bedrooms of space. If the city says the duplex isn't legally recognized, the plan changes. I have a full deal playbook with the numbers and can walk you through it.", "rank": 1, "playbook": {"verdict": "Works as an honest two-unit on FHA, with at least two bedrooms for me. The basement can't be a legal third unit (single-family zoning, and ADU rules don't apply to duplexes), so the question is how the two units are divided and which one gets the basement. Best case: the basement has a legal egress bedroom and becomes part of the 1-bedroom unit, giving me a 2-bedroom while the 4-bedroom rents at ~$2,400; that nets about $2,400 at $699k. If it can't, the fallback is a permitted re-divide into a 2-bedroom for me and a 3-bedroom rental. Open at $665k with the full 6% seller credit; land at $699–715k.", "gates": [{"t": "City confirms two legal units", "who": "Me or you · email, free · first", "body": "The parcel is zoned R-1-5000 (single-family). A duplex there is fine only if SLC recognizes it as a legally existing two-family (legal conforming under 21A.38.070). The assessor lists it as a duplex, but the county GIS record shows one housing unit, so we need it in writing. Ask zoning@slcgov.com (801-535-7700) about parcel 16-17-356-016-0000: is 1888–1890 a legally recognized two-family, and is there any permit or license history for the basement?", "kill": "The city says single-family: FHA's one-unit limit ($637,100) caps the price and no rent counts. Re-plan or walk."}, {"t": "Why the December contract died", "who": "You · agent-to-agent", "body": "Went pending nine days after listing at $749,900 and fell apart. Financing or cold feet is leverage for us. An appraisal that flagged the basement unit, paint, roof, or electrical is a warning, and I need to know exactly what and whether it was fixed.", "kill": "An appraisal failed on unit count or zoning and nothing has changed."}, {"t": "My lender pre-approval", "who": "Me · lender · this week", "body": "I'm getting my 2024–2025 returns to an FHA lender (one that also does 203(k)) to run DU with the 4-bedroom's market rent counted, and to confirm how many seller-paid discount points they allow. I'd like your lender recommendation.", "kill": ""}, {"t": "Layout: how I get two bedrooms", "who": "Tour + inspection + SLC Building", "body": "Get the floor plan. Option A needs a basement bedroom with a legal egress window, connected inside to the 1-bedroom unit. Option B/C moves the dividing wall between the two units so mine has two bedrooms and the rental has three; that's a permitted remodel that doesn't add a unit, but because the duplex is legal nonconforming, confirm with SLC Planning that re-dividing is allowed. A Limited 203(k) can fund the work.", "kill": "No egress is possible downstairs and the city won't allow re-dividing: then only option D/E (I take the 4-bedroom) gets me two bedrooms."}, {"t": "Appraisal and inspection", "who": "After an accepted offer", "body": "An FHA appraiser decides from the layout whether the basement is a separate unit. If it is, the property counts as three units, fails FHA's self-sufficiency test and the zoning, and FHA is dead. So the basement has to genuinely be part of my unit: a permitted decommission of the second kitchen, no separate lease, and an interior connection. Pre-1978 means every chipped paint surface gets fixed, the roof needs 2+ years of life, and no exposed wiring. Sewer scope and foundation check at er my income supports it at $735k.", "ask": "1) Is the current contract solid, and would the seller take a backup? 2) Has the city ever recognized the second unit or the ADU (any permit, rental license, or separate meters)? 3) Would the seller consider carrying a second (seller financing) to bridge the gap?", "offer": "Backup only, if it isn't already closed: $660,000 (90%) with 6% credit. Assessor has it at $557k.", "note": "Beautiful and two minutes from work, and I want at least two bedrooms of my own. Legally it's a single-family house, and Murray allows only one ADU per lot, with detached ADUs needing 10,000 sf (this lot is ~8,300). So on paper it can't be three legal units, and at most one rental can count toward my approval.", "rank": 2, "playbook": {"verdict": "I'd live in the 2-bedroom upstairs and rent the rest, which pencils to about $2,000–2,500 a month in real cash. The paper is the problem. It's legally a single-family house on a lot too small for Murray's detached-ADU rules, and Murray allows only one ADU per lot, so at most one of the two rentals can be legal. That means conventional or FHA financing on a single-family house, with at most one ADU's rent counted, capped and discounted. It only works if the price comes down toward $660–700k and the city recognizes at least one unit.", "gates": [{"t": "What Murray recognizes", "who": "Me · Murray Planning (801-270-2430) · first", "body": "Ask for permits and certificates of occupancy for the basement apartment and the detached ADU, any recorded ADU owner-occupancy affidavit, and any rental business license on the address. Murray: one ADU per lot, owner occupancy, no separate meters, detached ADUs need a 10,000 sf lot.", "kill": "Neither unit is permitted."}, {"t": "Lease breakdown and my unit", "who": "You · agent-to-agent", "body": "Break the $4,745 down by unit with leases, end dates, and deposits. The main floor appears to be advertised for rent at $2,649, so confirm it can be delivered vacant for me.", "kill": "The unit I'd live in can't be delivered vacant."}, {"t": "Appraisal as a single-family", "who": "Lender", "body": "An appraiser will likely value it as a single-family house with at most one legal ADU, which may land well under $735,000. The price has to follow the appraisal.", "kill": "It appraises far under the price and the seller won't follow it."}], "numbers": {"head": ["Price", "Payment, conventional 5% at ~6.9%", "With ~2.5 seller-paid points", "Net renting the basement + ADU (~$3,000)"], "rows": [["$735,000", "$5,325", "$5,037", "$2,037"], ["$700,000", "$5,091", "$4,817", "$1,817"], ["$660,000", "$4,823", "$4,565", "$1,565"]], "note": "Conventional 5% down, since FHA's one-unit limit is $637,100; PMI ≈ 0.55%/yr; taxes $2,480/yr; insurance ≈ $200/mo. The lender counts at most one legal ADU's rent toward approval."}, "offer": ["Open $660,000 (90%) with a seller credit toward points; landing near $700,000.", "Contingencies: Murray confirmation of which units are legal; appraisal; my unit delivered vacant.", "Only worth writing if gate 1 comes back with at least one permitted unit."], "ask": ["Unit-by-unit rent breakdown of the $4,745, with leases and end dates?", "Murray permits or certificates of occupancy for the basement apartment and the detached ADU? A recorded ADU affidavit?", "A rental business license on the address?", "Will the seller accept an appraisal-based price, and can the upstairs be delivered vacant?", "What's behind the $27 HOA the listing mentions?"], "avoid": ["Counting on two rentals the city hasn't approved."]}}, {"id": "driggs", "status": "active", "addr": "1252 E Driggs Ave", "area": "Sugar House 84106", "price": "$599,900", "mls": "2181877", "url": "https://www.redfin.com/UT/Salt-Lake-City/1252-E-Driggs-Ave-84106/home/91750169", "type": "Duplex (up/down)", "facts": "1948 up/down in Sugar House: upper ≈ 2bd/1ba, lower level with its own entrance, kitchen, living room, 1 bedroom, and full bath. Separate gas and electric meters, two furnaces, new water heater, sewer line replaced. Detached 2-car garage (1965) and a large backyard. Listing calls it a 'legal nonconforming duplex,' but the county records a single-family house, 1 unit (858 sf above grade + 700 sf basement, 500 finished), 2026 value $498,500. Marketed since Nov 2025 at $659,900; relisted Aug 28 at $599,900. 12 min from the shop.", "net": "With the 1bd basement renting ~$1,300, net lands near $2,800 even with a seller-paid buydown, ≈ $3,100 without. It gets to $2,500 with a roommate in my unit, a price near $545k, or a stronger basement rent.", "ask": "Is the lower unit licensed with SLC as a rental, and what has it rented for? Would the seller do a 6% credit at $599.9k, or a price cut to the mid-$500s? Any FHA appraisal history?", "offer": "Open at $535,000 (89%) with 6% credit; seller nets ≈ $503k. Marketed since Nov 2025 from $659.9k, four cuts, day count reset Aug 28, Redfin $594.7k, county $498.5k. A cost-conscious discount-brokerage seller who has chased the market for ten months. Comfortable landing: $564k with the credit.", "note": "I like this one: it lives like a house in Sugar House with a detached 2-car garage and a real backyard. New listing (12 days) so probably less room right now. 2026-09-10: the '12 days' is a relist mask. Cumulative ≈ 290 days, four price cuts. There is real room here.", "rank": 3, "playbook": {"verdict": "Lives like a house in Sugar House, which is why I like it. But the paper doesn't match the pitch: the listing says legal nonconforming duplex, while the county records one single-family unit valued at $498,500, about $100,000 under the ask. If the city can document the duplex, it's a clean two-unit where I live upstairs and 75% of the basement's rent counts. If it can't, it's a single-family loan with no rent counted, and the appraisal is likely to come in far under the price. Either way, the county number and ten months of cuts justify a hard open.", "gates": [{"t": "City record of a legal two-family", "who": "Me or you · SLC Planning / zoning@slcgov.com · first", "body": "Likely zoned R-1/7,000 (to be confirmed). A duplex there is legal only if it has existed legally since before the zoning changed (21A.38). Ask for the nonconforming-use record or a zoning verification letter for two units. The county's one-unit record means this may not exist.", "kill": "No city record of two legal units, and the price doesn't fall toward a single-family value."}, {"t": "Appraisal risk", "who": "Lender", "body": "County $498,500; Redfin $594,693. As a single-family house with an extra kitchen, the appraisal may land near $500–560k. The price has to follow the appraisal.", "kill": "An appraisal gap the seller won't cover."}, {"t": "Basement bedroom and permits", "who": "Inspection", "body": "Egress window in the basement bedroom; permits for the lower kitchen and bath; pre-1978 paint; roof and electrical-panel ages; sewer-line permit and video.", "kill": ""}], "numbers": {"head": ["Price", "Payment at 6.35%", "With ~2.5 seller-paid points", "Net renting the basement ($1,400)", "Net with a roommate upstairs too ($750)"], "rows": [["$599,900", "$4,415", "$4,178", "$2,778", "$2,028"], ["$564,000", "$4,162", "$3,939", "$2,539", "$1,789"], ["$535,000", "$3,957", "$3,745", "$2,345", "$1,595"]], "note": "FHA 30-year, my own 3.5% down, taxes ≈ 0.6%/yr, insurance ≈ $180/mo. Sugar House 1bd basement units rent about $1,300–1,500. Only counts toward approval if the city documents two legal units."}, "offer": ["Open $535,000 (89%) with a 6% seller credit. Landing $564,000.", "Why: marketed since Nov 2025 from $659,900 with four cuts and a relist to reset the day count; county value $498,500.", "Contingencies: city two-family documentation; FHA appraisal (price follows it); inspection with sewer video."], "ask": ["Can you provide the city's legal nonconforming / two-family record or a zoning letter?", "Will the seller accept FHA?", "Roof and electrical-panel ages?", "Legal egress in the basement bedroom? Were the lower kitchen and bath permitted?", "Is it leased now? Rent history on the lower unit?", "Who did the sewer line, and is there a permit and video?"], "avoid": ["Paying a duplex price for what the county and appraiser treat as a single-family house."]}}, {"id": "7670", "status": "active", "addr": "473 E 7670 S", "area": "Midvale 84047", "price": "$599,000", "mls": "2179007", "url": "https://www.redfin.com/UT/Midvale/473-E-7670-S-84047/home/91815350", "type": "Duplex", "facts": "County: duplex, 2 units, built 1978; 1,656 sf above grade + 884 sf basement (850 finished); 2026 value $604,400, so the ask is below the county number. Garage, fenced yard, and deck per side; each side has a big downstairs bedroom with a full bath. Roughly 3bd/2ba on one side and 2bd + den/2ba on the other (not verified). One side recently updated and deliverable vacant; the other is a long-term month-to-month tenant open to a new lease (rent not disclosed). Washer, dryer, curtains, and shed on the tenant side are excluded. 5 min from the shop. Cut $619.5k → $599k on 9/9.", "net": "Works only if the tenant side is the bigger unit at $2,100+. The $20.5k cut takes about $145/mo off the payment ($20.5k × 0.965 × 1.0175 financed MIP = $20.1k less loan × 0.00622 at 6.35% ≈ $125 P&I, plus ≈ $10 tax and ≈ $9 MIP): ≈ $2,505, or ≈ $2,130 with a buydown.", "ask": "Exact unit split (beds/baths per side) and what the tenant side rents for.", "offer": "Open at $555,000 (92.7%) with 6% credit; seller nets ≈ $522k. Least room on the list: only 26 days, and Redfin ($610k) and county ($604k) sit above the ask. The trust seller and 'priced to sell' language are the opening. Landing: $563–575k with the credit.", "note": "Moved up to #4. Five minutes from the shop with a garage and fenced yard per side. Need the unit split and the tenant side's rent before it's a real candidate. 2026-09-10: cut to $599k (−$20.5k); that puts it right at my $2,500 line if the tenant side rents $2,100+.", "rank": 4, "playbook": {"verdict": "The cleanest paper on the list: the county already records it as a two-unit duplex, the price is under the county value, and it's five minutes from the shop with a garage and fenced yard per side. The whole deal turns on one number the listing won't give: what the long-term tenant pays. At a $1,900–2,300 market rent for a garage-and-yard side, I net roughly $1,800–2,100 with a modest buydown. Least negotiating room on the list (26 days, county and Redfin both above ask), so the open is closer to list.", "gates": [{"t": "The tenant's rent and lease", "who": "You · agent-to-agent · first", "body": "Get the current rent, the lease or month-to-month terms, the deposit, and the payment history, plus an estoppel letter from the trustee confirming them. Midvale comps for a 3bd/2ba duplex side run about $1,900–2,340. The lender counts 75% of the lesser of the lease or the appraiser's market rent, so a below-market rent hurts twice.", "kill": "The tenant pays well under market and won't sign a new lease at market."}, {"t": "Two legal units in writing", "who": "Me · Midvale Planning (801-567-7200)", "body": "The county shows 2 units, but the zoning district isn't confirmed. Ask for a zoning verification letter confirming a legal two-family (or legal nonconforming).", "kill": "The city won't confirm two legal units."}, {"t": "Which side I live in", "who": "Me", "body": "I take the updated side that can be delivered vacant and rent the tenant side. Confirm the bed and bath count per side and whether gas, electric, and water are separately metered.", "kill": ""}, {"t": "Trust signing and FHA repairs", "who": "You · agent-to-agent", "body": "Confirm who the trustee is and that they can sign. Ask whether the trust will accept FHA and complete appraiser-required repairs.", "kill": "The trust refuses FHA or required repairs."}], "numbers": {"head": ["Price", "Payment at 6.35%", "With ~2.5 seller-paid points", "Net if tenant side rents $2,100", "Net at $1,900"], "rows": [["$599,000", "$4,409", "$4,172", "$2,072", "$2,272"], ["$575,000", "$4,239", "$4,012", "$1,912", "$2,112"], ["$555,000", "$4,098", "$3,879", "$1,779", "$1,979"]], "note": "FHA 30-year, my own 3.5% down, taxes ≈ 0.6% of price per year, insurance ≈ $180/mo. The tenant's actual rent will replace these assumptions."}, "offer": ["Open $555,000 (92.7%) with a 6% seller credit. Landing $563,000–575,000.", "Why not lower: only 26 days, and the county ($604,400) and Redfin ($610,426) both sit above the ask. The leverage is the trust seller and 'priced to sell.'", "Contingencies: tenant estoppel and lease review; Midvale zoning letter for two units; FHA appraisal; inspection."], "ask": ["What is the tenant's current rent? Lease, deposit record, and payment history?", "Separately metered gas, electric, and water? Who pays what?", "Any Midvale zoning letter or permit record for two units?", "Will the trustee accept FHA and pay for appraiser-required repairs?", "Exact bed/bath count per side; ages of the roof, furnaces, and water heaters?", "Who is the trustee, and will they sign a tenant estoppel?"], "avoid": ["Buying without the tenant's actual rent in writing."]}}, {"id": "1000e-7795", "status": "active", "addr": "7795 S 1000 E", "area": "Midvale 84047", "price": "$515,400", "mls": "2144689", "url": "https://www.redfin.com/UT/Midvale/7795-S-1000-E-84047/home/91814642", "type": "House + basement unit", "facts": "County: single-family, 1 unit, built 1968; 1,000 sf main floor + 1,000 sf basement (965 finished); 4bd/3ba; 2026 value $504,500. The second unit is a basement apartment (listing: 'fully rented basement apartment'), rent not stated in the listing. Upstairs has hardwoods, an updated kitchen, gas fireplace, central air. Attached 2-car garage plus 5 parking spaces. 6,534 sf lot. Six price cuts from $590k; contract fell through Aug 17; living-trust seller. 6 min from the shop.", "net": "≈ $2,390 with the existing tenant.", "ask": "Is the unit permitted with Midvale? If yes, the rent counts toward my approval and this jumps to the top of the house list.", "offer": "Open at $455,000 (88%) with 6% credit; seller nets ≈ $428k. Six cuts from $590k, a living-trust seller, and a contract that died in August. Redfin $508k, county $504.5k. Landing: $479k with the credit.", "note": "If Midvale confirms the unit is permitted, this is the easiest deal on the list: existing $1,400 tenant, net ≈ $2,390, 151 days on market. 2026-09-10: went contingent Aug 10 and fell through Aug 17, then cut again to $515.4k. Trust-owned. Real motivation.", "rank": 5, "playbook": {"verdict": "Cheapest real house hack on the list, and a trust seller that has cut six times and lost a buyer in August. It's a single-family home with a basement apartment, so it lives or dies on whether Midvale permitted that apartment. If it did, FHA lets the lender count part of the basement rent, and at a $479,000 landing with a buydown I net about $2,000 a month with a tenant at $1,400. If it didn't, the payment still works for my budget, but the lender counts none of the rent.", "gates": [{"t": "Is the basement apartment permitted?", "who": "Me · Midvale Community Development (801-567-7200) · first", "body": "Midvale allows one internal ADU with a single-family home on lots over 6,000 sf (this one is 6,534), with the owner living on site, no separate meters or address, a building permit, and off-street parking. Ask for the parcel's permit history (ADU permit or registration, finished-basement permit, egress windows) and a letter stating the ADU is legal and rentable.", "kill": "It's unpermitted and can't be legalized: no rent counts, and I'd carry code exposure."}, {"t": "What killed the August contract", "who": "You · agent-to-agent", "body": "Went under contract 8/10 and relisted 8/17. Appraisal, inspection, financing, or the ADU's legality? Each answer changes the plan.", "kill": "It was the ADU's legality or a structural problem."}, {"t": "How FHA counts the rent", "who": "Me · lender", "body": "Under HUD's 2023 ADU rule, rent from a legal ADU on a 1-unit home can count, capped at 30% of total qualifying income, with a haircut of 75% or 50% of the lesser of lease or market rent depending on how the lender reads it. It also needs two months of payments in reserve after closing. I'll get the lender's reading in writing.", "kill": ""}, {"t": "The lease", "who": "You · agent-to-agent", "body": "Rent, term, deposit, and whether the lease transfers. Midvale 2bd basement comps run about $1,200–1,400, so $1,400 is the top of the range.", "kill": ""}], "numbers": {"head": ["Price", "Payment at 6.35%", "With ~2.5 seller-paid points", "Net with a $1,400 tenant", "Net at $1,250"], "rows": [["$515,400", "$3,819", "$3,615", "$2,215", "$2,365"], ["$479,000", "$3,562", "$3,372", "$1,972", "$2,122"], ["$455,000", "$3,392", "$3,212", "$1,812", "$1,962"]], "note": "FHA 30-year, my own 3.5% down, taxes ≈ 0.6% of price per year, insurance ≈ $180/mo. The basement rent helps my monthly budget either way; whether the lender counts it depends on the permit."}, "offer": ["Open $455,000 (88%) with a 6% seller credit. Landing $479,000.", "Why: six cuts from $590,000, a failed contract, a living-trust seller, ~174 days. Redfin $508,062; county $504,500.", "Contingencies: Midvale confirmation the basement unit is legal; FHA appraisal; inspection including basement egress."], "ask": ["Why did the August contract fall through?", "Does the basement unit have a Midvale permit or registration, and egress windows in the bedrooms?", "Lease terms, rent, deposit; is the lease assignable?", "One meter? How are utilities split?", "Will the trust accept FHA, pay required repairs, and give a credit? Is the trustee able to sign alone?"], "avoid": ["Renting a basement unit the city hasn't approved."]}}, {"id": "hampton-143", "status": "active", "addr": "143 E Hampton Ave", "area": "Liberty Wells 84115", "price": "$500,000", "mls": "2164670", "url": "https://www.utahrealestate.com/2164670", "type": "House + basement suite", "facts": "1921 bungalow, 3bd/3ba, 1,341 sf listed (county: 849 sf above grade + 200 sf unfinished basement, 1 kitchen, 1 bath), walkout basement with a family room, 2 bedrooms, a bath, and laundry. Geothermal heating and cooling. 16×12 detached garage (1933). 0.07 ac. County 2026 value $353,500 (2025: $404,200). Seller accepts cash, conventional, FHA, VA, and seller financing. Flip bought ~$304k in 2025; eight cuts since October.", "net": "≈ $2,175–2,475 if the suite has a kitchen (not stated).", "ask": "Does the suite have a kitchen and its own entrance? Permitted?", "offer": "Open at $440,000 (88%) with 6% credit; seller nets ≈ $414k. A flip bought for ~$304k in March 2025, eight cuts since October, stalled since Aug 18, county $353.5k. The FHA appraisal will drag the price anyway. Landing: $470k with the credit.", "note": "Small lot, but rebuilt to the studs at $500k. Need to know if the suite has a kitchen.", "rank": 6, "playbook": {"verdict": "This is a house, not a house hack: the county shows one kitchen, and the 'second full suite' is two basement bedrooms and a bath, not an apartment. The honest play is a single-family FHA loan and renting a room or two to roommates, which the lender won't count but my budget will. The real risk is value: the county has it at $353,500, and much of the finished space the listing claims isn't on the county record, so the appraisal could come in well under $500,000. The seller also offers seller financing, which is worth asking about.", "gates": [{"t": "Permits for the rebuild and basement", "who": "You · agent-to-agent · first", "body": "The listing claims 1,341 sf; the county shows 849 above grade and 200 sf of unfinished basement. Get permit numbers for the rebuild and the basement finish. Unpermitted space may be left out of the appraisal.", "kill": "The basement finish was unpermitted."}, {"t": "Appraisal", "who": "Lender", "body": "County $353,500; Redfin $494,325. Write the offer so the price follows the appraisal.", "kill": "It appraises near the county value and the seller won't follow it."}, {"t": "Geothermal and roof", "who": "Inspection", "body": "Geothermal is unusual in a 1921 house; get its age, installer, and warranty. Roof age isn't stated. Pre-1978 paint and basement-bedroom egress apply.", "kill": ""}], "numbers": {"head": ["Price", "Payment at 6.35%", "With ~2.5 seller-paid points", "Net renting two basement rooms (~$1,400 total)"], "rows": [["$500,000", "$3,631", "$3,433", "$2,033"], ["$470,000", "$3,434", "$3,248", "$1,848"], ["$440,000", "$3,237", "$3,064", "$1,664"]], "note": "FHA 30-year, my own 3.5% down, taxes $2,054/yr, insurance ≈ $180/mo. Room rents don't count toward approval."}, "offer": ["Open $440,000 (88%) with a 6% seller credit. Landing $470,000.", "Why: a flip bought for about $304k, eight cuts since October, stalled since Aug 18, and a county value of $353,500.", "Ask what seller-financing terms they'd offer; it could beat FHA if the appraisal is low."], "ask": ["Permit numbers for the rebuild, basement finish, and bath?", "Why 849 sf above / 200 sf basement per the county vs 1,341 listed?", "Geothermal system age, installer, and warranty?", "Roof age?", "Is there a kitchen in the basement? (County says no.)", "Would the seller credit an appraisal gap, or carry financing?"], "avoid": ["Treating the basement as a rental unit; it's bedrooms in a single-family house."]}}, {"id": "zinnia-10282", "status": "active", "addr": "10282 S Zinnia Way", "area": "Sandy 84094", "price": "$415,000", "mls": "2180131", "url": "https://www.redfin.com/UT/White-City/10282-S-Zinnia-Way-84094/home/91840898", "type": "Single-family", "facts": "1959 rambler, 3bd/1ba, 1,026 sf, slab (no basement), attached 1-car garage with opener, fully fenced 0.19 ac lot with mature trees and RV parking. 21 days. ~11 min (estimated).", "net": "No tenant: $415k × 0.965 × 1.0175 = $407.5k loan → P&I ≈ $2,535 + MIP ≈ $184 + tax ≈ $208 + insurance ≈ $180 = ≈ $3,107/mo. About $600 over my line.", "ask": "Seller credit or a buydown on the table?", "offer": "Open at $390,000 (94%) with 6% credit toward a rate buydown. Only 21 days, so modest room; the credit matters more than the price here.", "note": "Ben reviewed 2026-09-10: ranked. Payment (~$3,100 with no tenant) is the hurdle, so a seller credit toward a buydown matters here.", "rank": 1, "playbook": {"verdict": "Best house for the money of the three, but the appraisal is the risk: the county values it at $368,800, about 11% under the $415,000 ask. It sat ~107 days last fall, went under contract in December, fell through, and relisted in August at the same price. Open at $375,000 with a 6% seller credit toward a buydown; land around $395,000. Even then the payment runs a couple hundred over my $2,500 target, so the credit and a low appraisal are my leverage.", "gates": [{"t": "Why the December contract fell through", "who": "You · agent-to-agent", "body": "It went contingent 12/23/2025 and was pulled 1/4/2026. If a low appraisal killed it, the county's $368,800 value backs up a lower price. The sellers and the listing agents share a last name (Marchant), so ask whether it's a family sale and whether the commission can help fund a buydown.", "kill": "The seller won't move from $415,000 and it appraises near the county value."}, {"t": "Appraisal", "who": "After an accepted offer", "body": "Write the offer so an appraisal shortfall reduces the price rather than making me cover the gap. Redfin's estimate is $415,422; the county is $368,800.", "kill": "An appraisal gap the seller won't cover."}, {"t": "Inspection: slab and sewer", "who": "Inspection", "body": "1959 rambler on a slab. Scope the sewer and find out whether lines run under the slab. Pre-1978 paint means any chipping gets fixed for FHA. Roof, panel, furnace, and water-heater ages are unknown.", "kill": "A failed sewer line under the slab."}], "numbers": {"head": ["Price", "Payment at 6.35%", "With ~2.5 seller-paid points (~5.73%)", "vs my $2,500 target"], "rows": [["$415,000", "$3,092", "$2,928", "$428 over"], ["$395,000", "$2,961", "$2,805", "$305 over"], ["$375,000", "$2,830", "$2,682", "$182 over"]], "note": "FHA 30-year, my own 3.5% down, taxes ≈ $210/mo (White City Metro Township, not Sandy), insurance ≈ $160/mo. Plain single-family, so no rent offsets the payment."}, "offer": ["Open $375,000 (90%) with a 6% seller credit toward closing and a rate buydown. Landing ≈ $395,000.", "Why: county value $368,800; ~128 cumulative days across two listings; a failed contract; no price change in 10 months.", "Appraisal clause: if it appraises under the price, the price drops to the appraisal (or we split the gap), not cash from me."], "ask": ["Why did the December 2025 contract fall through: appraisal, inspection, or financing?", "Are the sellers related to the listing agents? Is there commission flexibility to fund a buydown?", "Ages of the roof, water heater, and furnace/AC; panel size?", "Do the sewer or water lines run under the slab? Any scope report?"], "avoid": ["Covering an appraisal gap out of pocket.", "Waiving inspection on a 1959 slab house."]}}, {"id": "violet-1066", "status": "active", "addr": "1066 E Violet Cir", "area": "Sandy 84094", "price": "$439,000", "mls": "2172581", "url": "https://www.redfin.com/UT/White-City/1066-E-Violet-Cir-84094/home/86482622", "type": "Single-family", "facts": "1975, 2bd/1ba, 901 sf, no basement, detached 1-car garage with opener, large yard on a cul-de-sac with mature trees. Price already reduced; 55 days. ~11 min (estimated).", "net": "No tenant: $439k × 0.965 × 1.0175 = $431.0k loan → P&I ≈ $2,682 + MIP ≈ $194 + tax ≈ $220 + insurance ≈ $180 = ≈ $3,276/mo. About $775 over my line.", "ask": "Where will the seller land after 55 days and a cut? Credit toward a buydown?", "offer": "Open at $400,000 (91%) with 6% credit toward a buydown. Already reduced, 55 days.", "note": "Ben reviewed 2026-09-10: ranked. Already reduced and 55 days; ask about a credit toward a buydown.", "rank": 2, "playbook": {"verdict": "The most motivated seller of the three: four price cuts in three weeks, $465,000 down to $439,000, and 'REDUCED PRICE!!' in the remarks. The county values it at $447,900, above the ask, so the appraisal should be fine. The catch is condition: the county rates it 'fair' with 'minimum' maintenance, so expect FHA repair items. Open at $400,000 with a 6% credit and ask the seller to handle anything the appraiser flags.", "gates": [{"t": "Why the fast cuts", "who": "You · agent-to-agent", "body": "Relocating, carrying two houses, or just overpriced at $465k? A seller in a hurry is the whole opportunity here.", "kill": ""}, {"t": "Condition and FHA repairs", "who": "Inspection + appraisal", "body": "1975 brick, asphalt roof of unknown age, pre-1978 paint rules, and a 'fair' county condition rating. Get repair items fixed by the seller before closing rather than as a credit (repair credits count against FHA's 6% cap and reduce the price the loan is sized on).", "kill": "Repairs the seller won't make that FHA requires."}, {"t": "Two bedrooms, 901 sq ft", "who": "Me", "body": "It's the smallest of the three. The big 0.23-acre lot could take a detached ADU later under White City rules (to be verified), which is a real long-term upside.", "kill": ""}], "numbers": {"head": ["Price", "Payment at 6.35%", "With ~2.5 seller-paid points (~5.73%)", "vs my $2,500 target"], "rows": [["$439,000", "$3,185", "$3,011", "$511 over"], ["$420,000", "$3,060", "$2,894", "$394 over"], ["$400,000", "$2,929", "$2,771", "$271 over"]], "note": "FHA 30-year, my own 3.5% down, taxes ≈ $145/mo (White City Metro Township), insurance ≈ $160/mo. Plain single-family, no rent."}, "offer": ["Open $400,000 (91%) with a 6% seller credit toward closing and a buydown. Landing ≈ $420,000.", "Why: four cuts in three weeks, 55+ days, and a county value that supports the price, so the seller has room and a reason.", "Ask the seller to complete FHA-required repairs before closing, not as a credit."], "ask": ["Why four cuts so fast? Relocating or carrying another house?", "Ages of the roof, HVAC, and water heater; any known deferred maintenance?", "Any prior inspection or appraisal reports?", "Garage size, and is it permitted?"], "avoid": ["Taking repair money as a credit instead of having the work done (it counts against the 6% and shrinks the loan basis)."]}}, {"id": "redondo-53", "status": "active", "addr": "53 E Redondo Ave", "area": "South Salt Lake line 84115", "price": "$450,000", "mls": "2162522", "url": "https://www.redfin.com/UT/Salt-Lake-City/53-E-Redondo-Ave-84115/home/86428735", "type": "Single-family", "facts": "1919 Craftsman bungalow, 2bd/1ba, 984 sf on 0.07 ac, fully updated (newer roof, sewer line, water heater, radon mitigation), detached heated 1-car garage with workshop, fully fenced secluded yard with deck, pergola and outdoor kitchen. 99 days. Listing says it qualifies for Zions Bank's CRA loan (3% down, lender-paid PMI). ~14 min (estimated).", "net": "FHA, no tenant: $450k × 0.965 × 1.0175 = $441.8k loan → P&I ≈ $2,749 + MIP ≈ $199 + tax ≈ $225 + insurance ≈ $180 = ≈ $3,353/mo. About $850 over my line.", "ask": "Where will the seller go after 99 days, and would they pay points? Worth pricing the Zions CRA loan against FHA.", "offer": "Open at $410,000 (91%) with 6% credit toward a buydown. 99 days; also worth pricing the Zions CRA loan the listing mentions.", "note": "Ben reviewed 2026-09-10: great house, not a great location, but OK for now. 99 days; ask where the seller will land and whether they'd pay points.", "rank": 3, "playbook": {"verdict": "Great house, not a great location, and one real paper risk: the county classifies the parcel as a house on commercially zoned land. An FHA appraiser will ask whether it's legal nonconforming and could be rebuilt if destroyed, so get that answer first. The seller probably paid about $440,000 in 2022, so there's little room on price; push for a seller credit instead. Also compare FHA against the Zions Bank Affordable Home Mortgage the listing mentions (3% down, lender-paid mortgage insurance), which could beat FHA on payment.", "gates": [{"t": "Zoning: house on commercial land", "who": "Me or you · SLC Planning", "body": "County classification is 'RES-ON-COMM.' Ask SLC Planning for the zoning district and whether a single-family use there is legal nonconforming and rebuildable. That letter is what an FHA or Zions appraiser will want.", "kill": "The city says it can't be rebuilt as a home."}, {"t": "Square footage", "who": "You · listing agent", "body": "Listed at 984 sq ft, but the county says 767 above grade. A smaller appraised size weakens the value on a per-square-foot basis. The county value is $408,400.", "kill": ""}, {"t": "Loan choice: FHA vs Zions", "who": "Me · lenders", "body": "Zions' Affordable Home Mortgage: 3% down, lender-paid mortgage insurance, reduced fees, $1,500–3,000 closing help, for low-to-moderate income buyers or designated census tracts. Call 800-727-8893 to confirm this address qualifies and get a rate to compare with FHA.", "kill": ""}], "numbers": {"head": ["Price", "Payment at 6.35%", "With ~2.5 seller-paid points (~5.73%)", "vs my $2,500 target"], "rows": [["$450,000", "$3,277", "$3,099", "$599 over"], ["$430,000", "$3,146", "$2,976", "$476 over"], ["$410,000", "$3,014", "$2,852", "$352 over"]], "note": "FHA 30-year, my own 3.5% down, taxes ≈ $165/mo (Salt Lake City), insurance ≈ $160/mo. A Zions quote without mortgage insurance could come in lower; I'll add it once I have one."}, "offer": ["Open $410,000 (91%) with a 6% seller credit. Landing ≈ $430,000. Expect the seller to hold near $440,000; push the credit harder than the price.", "Why: 99+ days, a county value of $408,400, and a listing size (984 sq ft) the county doesn't support (767).", "Contingency: city confirmation that the residential use is legal and rebuildable."], "ask": ["Can you provide zoning confirmation and nonconforming-use or rebuild documentation?", "Why 984 sq ft in the listing vs 767 per the county?", "Electrical service (any knob-and-tube?) and foundation type?", "Permits for the sewer line, roof, and garage work?", "Would the seller credit 2–3% toward a buydown?"], "avoid": ["Buying without the zoning answer; an appraiser can refuse a home on commercial land that can't be rebuilt."]}}, {"id": "2700s-829", "status": "watching", "addr": "829 E 2700 S", "area": "Sugar House line 84106", "price": "$543,000", "mls": "2140639", "url": "https://www.utahrealestate.com/2140639", "type": "House + basement unit", "facts": "1949 house, rehabbed: new windows, plumbing, electrical, doors, flooring, paint. County records it as a residence with a mother-in-law apartment (class 106), 2 kitchens; 812 sf above grade + 812 sf basement (771 finished). The basement is a 2bd/1ba with its own kitchen and separate entrance, not rented. Detached garage (1953). Backyard 'needs TLC.' County 2026 value $565,600. Owner appears to be the listing agent, who bought for about $390k in Dec 2024. 190+ days, $500 micro-cuts.", "net": "$2,490–2,790 at $1,200–1,500 rent. Works only with a real price cut.", "ask": "What's the story behind 301 days?", "offer": "Open at $470,000 (86.6%) with 6% credit; seller nets ≈ $442k. Eleven months cumulative, fourteen $500 micro-cuts, owner appears to be the listing agent (no second commission to pay). Landing: $500k with the credit.", "note": "OK, not exciting. Only with a real price cut off 301 days.", "playbook": {"verdict": "A flip with a real basement apartment that the county already recognizes as a mother-in-law unit. To count its rent, SLC needs to have an ADU permit on file, and the owner has to live there, which I would. At a $500,000 landing with a buydown, I net about $2,160 renting the basement at $1,350. The owner-agent has cut in $500 steps for six months; a real number is the only thing that will move him.", "gates": [{"t": "ADU permit and flip permits", "who": "You · agent-to-agent + SLC · first", "body": "Ask for permits on the electrical, plumbing, and basement kitchen, and any SLC ADU permit. SLC ADUs require owner occupancy. Without a permit, the lender counts no rent.", "kill": "The flip work was unpermitted."}, {"t": "How FHA counts ADU rent", "who": "Me · lender", "body": "HUD's 2023 ADU rule lets a legal ADU's rent count on a 1-unit home, capped at 30% of qualifying income, at 50–75% of the lesser of lease or market rent, with two months of reserves.", "kill": ""}, {"t": "Inspection", "who": "Inspection", "body": "Sewer camera, roof and furnace age, basement-bedroom egress, and whether the backyard 'TLC' is anything worse.", "kill": ""}], "numbers": {"head": ["Price", "Payment at 6.35%", "With ~2.5 seller-paid points", "Net renting the basement ($1,350)"], "rows": [["$543,000", "$4,013", "$3,799", "$2,449"], ["$500,000", "$3,710", "$3,512", "$2,162"], ["$470,000", "$3,498", "$3,312", "$1,962"]], "note": "FHA 30-year, my own 3.5% down, taxes ≈ 0.6%/yr, insurance ≈ $180/mo."}, "offer": ["Open $470,000 (86.6%) with a 6% seller credit. Landing $500,000.", "Why: 11 months cumulative, fourteen $500 micro-cuts, an owner-agent paying no second commission, bought for about $390k.", "Contingencies: permits for the rehab and basement kitchen; FHA appraisal; inspection."], "ask": ["Permits for the electrical, plumbing, and basement kitchen, and any ADU permit?", "Separate meter for the basement unit?", "Roof and furnace ages?", "Sewer camera results?", "Will the seller accept FHA and cover required repairs?"], "avoid": ["Counting on basement rent without an ADU permit."]}}, {"id": "hampton-352", "status": "watching", "addr": "352 E Hampton Ave", "area": "Central City 84111", "price": "$699,900", "mls": "2141619", "url": "https://www.redfin.com/UT/Salt-Lake-City/352-E-Hampton-Ave-84111/home/91738513", "type": "Triplex", "facts": "1897 duplex on 0.24 ac; the county records 2 units (class 112, 3,092 sf above grade) and values it at $766,300, above the ask. MLS units: a 3bd/2ba and a 2bd/1ba, plus an undescribed mother-in-law apartment (a 2024 rental ad showed $995). Detached garage (1965) leased with storage for $350/mo. Two units tenant-occupied; showings only after an accepted offer; offers must be subject to inspection; 'AGENTS, SEE REMARKS.' LLC seller cutting ~$25k every five weeks from $825k. 17 min from the shop.", "net": "≈ $1,070 if I take the small unit. Best number in the valley on paper.", "ask": "Can it pass an FHA appraisal? What will the seller actually take after 187 days? Is the third unit licensed?", "offer": "Open at $610,000 (87%) with 6% credit; seller nets ≈ $573k. LLC seller cutting ~$25k every five weeks from $825k, Redfin $673.7k, next cut due late September. Landing: $644k with the credit.", "note": "Backup. Best net on paper but 1897 and 17 minutes; I'd rather make 1888 S 800 E work.", "playbook": {"verdict": "The only rental on my list where the county's unit count backs up the listing, and the county values it above the ask. I'd live in the 2-bedroom and rent the 3-bedroom and garage; that alone nets about $1,800 at a $644,000 landing, and the mother-in-law apartment would take it under $1,000 if it's legal. The catches are age (1897), the third unit's legality, and existing tenants. It's 17 minutes from the shop, so it stays a backup behind 1888 S 800 E.", "gates": [{"t": "Private remarks and the rent roll", "who": "You · agent-to-agent · first", "body": "Read the private remarks. Get the rent roll, leases, deposits, and end dates. Confirm the 2-bedroom can be delivered vacant for me.", "kill": "The leases block owner move-in."}, {"t": "The mother-in-law apartment", "who": "Me · SLC Planning", "body": "Zoning is probably RMF-35 (to be confirmed). If three units are legal, FHA's self-sufficiency test applies and likely fails at these rents, so the cleaner path is financing it as a two-unit, with the third space merged into a unit or removed with a permit. Ask the city what's recognized.", "kill": "The city or lender requires removal and the seller won't allow it before closing."}, {"t": "1897 condition", "who": "Inspection", "body": "Knob-and-tube, foundation, sewer line, roof, and lead paint, all likely FHA conditions. A Limited 203(k) (up to $75,000) can fund required repairs.", "kill": ""}], "numbers": {"head": ["Price", "Payment at 6.35%", "With ~2.5 seller-paid points", "Net renting the 3bd ($2,295) + garage ($350)", "Also renting the mother-in-law unit (~$995)"], "rows": [["$699,900", "$5,121", "$4,844", "$2,199", "$1,204"], ["$644,000", "$4,726", "$4,472", "$1,827", "$832"], ["$610,000", "$4,486", "$4,245", "$1,600", "$605"]], "note": "FHA 30-year as a two-unit, my own 3.5% down, taxes ≈ 0.6%/yr, insurance ≈ $180/mo. Only 75% of the 3bd's rent counts toward approval; the garage and mother-in-law rent likely don't."}, "offer": ["Open $610,000 (87%) with a 6% seller credit. Landing $644,000.", "Why: cut from $825k in ~$25k steps every five weeks; next cut likely late September near $675k. Redfin $673,697.", "Offer subject to inspection, as the listing requires, plus FHA appraisal as a two-unit."], "ask": ["What's in the private remarks?", "Is the mother-in-law apartment permitted or covered by a city nonconforming record?", "Rent roll, leases, deposits, and end dates?", "Separate meters per unit?", "Roof, electrical, and sewer ages; any knob-and-tube?", "Will the seller accept FHA and required repairs?"], "avoid": ["Counting the mother-in-law unit's rent until the city says it's legal."]}}, {"id": "malvern-89", "status": "dropped", "addr": "89 W Malvern Ave", "area": "South Salt Lake 84115", "price": "$369,999", "mls": "2184292", "url": "https://www.redfin.com/UT/South-Salt-Lake/89-W-Malvern-Ave-84115/home/86406415", "type": "House + basement unit", "facts": "1956, 3bd/2ba, 1,716 sf on 0.14 ac. Main floor 2bd/1ba; 95%-finished walkout basement with its own kitchen, 1bd/1ba, family room and laundry behind a separate entrance. Detached 2-car tandem garage, fully fenced lot, covered patio. Sold as-is (fixer). Listed Sep 9. West of State St near I-15, ~12 min from the shop (estimated).", "net": "FHA 3.5% at 6.35%: $369,999 × 0.965 = $357.0k + 1.75% UFMIP = $363.3k loan → P&I ≈ $2,261 + MIP ≈ $164 + tax ≈ $185 + insurance ≈ $180 = ≈ $2,789. Minus a $1,000–1,200 basement rent (my estimate, unverified) ≈ $1,590–1,790 net. The unit's legal status is unknown, so the lender wouldn't count that rent.", "ask": "What does as-is cover (roof, furnace, sewer, known defects)? Would it pass an FHA appraisal as-is, or does it need a 203(k)? Is the basement unit permitted or registered with South Salt Lake? Seller open to FHA and a credit?", "offer": "", "note": "Dropped 2026-09-10: Ben passed. No thanks."}, {"id": "murray-2166818", "status": "dropped", "addr": "Undisclosed address, Murray", "area": "Murray 84107", "price": "$415,000", "mls": "2166818", "url": "https://www.redfin.com/UT/Murray/Undisclosed-address-84107/home/91789779", "type": "Single-family", "facts": "1950, 3bd/2ba, 1,145 sf, oversized attached 2-car garage, all yards fenced, double driveway plus a gated back drive to a city-park lot (RV/trailer parking), paid-off solar, updated electrical and windows. Seller withheld the address; the map pin is between State St and I-15 about 1.5 mi west of the shop (~5 min, estimated). 36 days.", "net": "No tenant: $415k × 0.965 × 1.0175 = $407.5k loan → P&I ≈ $2,535 + MIP ≈ $184 + tax ≈ $208 + insurance ≈ $180 = ≈ $3,107/mo. About $600 over my line.", "ask": "What's the address, and why is it withheld (tenant, estate)? Room on price after 36 days?", "offer": "", "note": "Dropped 2026-09-10: Ben passed."}, {"id": "first-488w", "status": "dropped", "addr": "488 W 1st Ave", "area": "Midvale 84047", "price": "$430,000", "mls": "2182932", "url": "https://www.redfin.com/UT/Midvale/488-W-1st-Ave-84047/home/91790199", "type": "Single-family", "facts": "1912, 3bd/2ba, 1,779 sf, updated kitchen, detached 2-car garage with opener, fully fenced secluded yard with mature trees and sprinklers. Sold as-is. 7 days. Old Midvale just east of I-15, ~8 min (estimated).", "net": "No tenant: $430k × 0.965 × 1.0175 = $422.2k loan → P&I ≈ $2,627 + MIP ≈ $190 + tax ≈ $215 + insurance ≈ $180 = ≈ $3,212/mo. About $700 over my line.", "ask": "Why as-is? Anything a 1912 house would fail on an FHA appraisal (paint, roof, wiring)?", "offer": "", "note": "Dropped 2026-09-10: Ben passed."}, {"id": "rose-garden", "status": "dropped", "addr": "4358 S Rose Garden Ln", "area": "Millcreek 84124", "price": "$559,000", "mls": "2173815", "url": "https://www.redfin.com/UT/Salt-Lake-City/4358-S-Rose-Garden-Ln-84124/home/91858130", "type": "Duplex", "facts": "Brick side-by-side 2 × 2bd/1ba, 1954, 2-car garage, own fenced yard each side, cul-de-sac. 8 min from the shop. New electrical/AC 2023, roof 2017. Both sides long-term tenants (7 and 5 years). Seller financing offered.", "net": "≈ $2,500 with my own 3.5% down, ≈ $2,365 with a seller-paid point, under $2,200 with both.", "ask": "Will the seller deliver one side vacant? Current rents and lease terms? Any prior FHA appraisal?", "offer": "", "note": "Dropped: I'm out on this one."}, {"id": "10600s", "status": "dropped", "addr": "804 E 10600 S", "area": "Sandy 84094", "price": "$469,000", "mls": "", "url": "https://www.redfin.com/UT/Sandy/804-E-10600-S-84094/home/91841457", "type": "Duplex (non-conforming)", "facts": "2 × 2bd/1ba, 1952, detached garage, mostly fenced yard. Rents $2,090 total (about $1,045 a side, below market), sold with tenants. Furnace ~56 years old, no showings before an accepted offer. 11 min.", "net": "≈ $2,470 at current rent, ≈ $1,920 if the other side re-leases at market.", "ask": "Is an offer contingent on inspection realistic given \"no showings\"? Will the lender count rent on a non-conforming unit?", "offer": "", "note": "Dropped: 10600 South is too busy a road."}, {"id": "700e-4401", "status": "dropped", "addr": "4401 S 700 E", "area": "Millcreek 84107", "price": "$599,000", "mls": "2165168", "url": "https://www.redfin.com/UT/Millcreek/4401-S-700-E-84107/home/91799605", "type": "Duplex", "facts": "Remodeled 2 × 2bd up/down, 1924, oversized garage with 220V, xeriscaped yard, rents $3,025 total, 89 days. 7 min. Fronts busy 700 E.", "net": "≈ $2,550–2,650 with a buydown, so close.", "ask": "Any FHA appraisal history on a 1924 building? Lease terms?", "offer": "", "note": "Dropped: the yard is rock, not a yard."}, {"id": "fenton", "status": "dropped", "addr": "332 E Fenton Ave", "area": "South Salt Lake 84115", "price": "$759,000", "mls": "2183415", "url": "https://www.redfin.com/UT/South-Salt-Lake/332-E-Fenton-Ave-84115/home/86488451", "type": "Duplex", "facts": "1988, 2 × 3bd/2.5ba, 2-car garage and private yard per unit, $2,320 each, both leased through Aug 2027. 9 min.", "net": "Above my band, and the leases block FHA occupancy.", "ask": "Would the seller negotiate one tenant out? Only then is this interesting.", "offer": "", "note": "Dropped: too big for what I want, and both units are leased through 2027."}, {"id": "lambourne", "status": "dropped", "addr": "458 E Lambourne Ave", "area": "South Salt Lake 84115", "price": "$650,000", "mls": "2143211", "url": "https://www.redfin.com/UT/South-Salt-Lake/458-E-Lambourne-Ave-84115/home/86434133", "type": "Duplex", "facts": "2022 gut remodel, 1-car garage per unit, fenced yards, 180 days.", "net": "≈ $3,350.", "ask": "", "offer": "", "note": "Over my monthly number unless I take a roommate. Keeping it here only so you know I saw it."}]}</script>

(function(){
  var stateEl = document.getElementById('state');
  var STATE = JSON.parse(stateEl.textContent);
  var CSS = document.getElementById('css').textContent;
  var JS = document.getElementById('app-js').textContent;
  var esc = function(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var LABEL = {new:'New', active:'Active', watching:'Watching', dropped:'Dropped'};

  function propCard(p, editing){
    var h = '<div class="prop '+esc(p.status)+'" data-id="'+esc(p.id)+'">';
    h += '<div class="head"><h4>'+(p.rank?'<span class="rank">#'+esc(p.rank)+'</span> ':'')+(p.url?'<a href="'+esc(p.url)+'">'+esc(p.addr)+'</a>':esc(p.addr))+'</h4><span class="price">'+esc(p.price)+'</span><span class="sub">'+esc(p.area)+(p.mls?' · MLS '+esc(p.mls):'')+' · '+esc(p.type)+'</span><span class="cat '+(isSFH(p)?'sfh':'rent')+'">'+(isSFH(p)?'Single family':'Rental')+'</span></div>';
    h += '<span class="pill '+esc(p.status)+'">'+esc(LABEL[p.status]||p.status)+'</span>';
    h += '<div class="body"><p>'+esc(p.facts)+'</p>';
    if(p.net) h += '<p><span class="lbl">Monthly</span><span class="net">'+esc(p.net)+'</span></p>';
    if(p.offer) h += '<p><span class="lbl">Opening offer</span>'+esc(p.offer)+'</p>';
    if(p.ask) h += '<p><span class="lbl">Ask</span>'+esc(p.ask)+'</p>';
    h += '</div>';
    if(p.note) h += '<div class="note"><span class="lbl">Note</span>'+esc(p.note)+'</div>';
    if(p.playbook && !editing) h += '<div class="body"><a class="pb-link" href="#pb='+esc(p.id)+'">Open the full playbook →</a></div>';
    if(editing){
      h += '<div class="edit"><select data-field="status">';
      ['new','active','watching','dropped'].forEach(function(s){ h += '<option value="'+s+'"'+(p.status===s?' selected':'')+'>'+LABEL[s]+'</option>'; });
      h += '</select><textarea data-field="note" placeholder="Note for Corey (why it moved, what we learned)">'+esc(p.note)+'</textarea></div>';
    }
    return h+'</div>';
  }

  function isSFH(p){ return /^single-family/i.test(p.type||''); }
  function section(title, list, editing, intro){
    if(!list.length) return '';
    var rentals = list.filter(function(p){return !isSFH(p);}), sfh = list.filter(isSFH);
    var h = '<h3>'+title+'</h3>'+(intro?'<p>'+intro+'</p>':'');
    if(rentals.length) h += '<h4 class="subhead rent">Rentals <span>duplex, triplex, or a house with a rentable unit</span></h4><div class="props rent">'+rentals.map(function(p){return propCard(p, editing);}).join('')+'</div>';
    if(sfh.length) h += '<h4 class="subhead sfh">Single family <span>plain house, no second unit</span></h4><div class="props sfh">'+sfh.map(function(p){return propCard(p, editing);}).join('')+'</div>';
    return h;
  }

  function tabBar(state, cur){
    var pbs = state.props.filter(function(p){return p.playbook && p.status!=='dropped';});
    var r = pbs.filter(function(p){return !isSFH(p);}), f = pbs.filter(isSFH);
    var byRank = function(a,b){return (a.rank||99)-(b.rank||99);};
    r.sort(byRank); f.sort(byRank);
    var t = function(p){ return '<a class="'+(isSFH(p)?'sfh':'rent')+(cur===p.id?' on':'')+'" href="#pb='+esc(p.id)+'">'+(p.rank?'#'+esc(p.rank)+' ':'')+esc(p.addr)+'</a>'; };
    var h = '<nav class="tabs" aria-label="Property playbooks"><a class="'+(cur?'':'on')+'" href="#">Overview</a>';
    if(r.length) h += '<span class="sep"></span>'+r.map(t).join('');
    if(f.length) h += '<span class="sep"></span>'+f.map(t).join('');
    return h+'</nav>';
  }
  function playbookView(state, p){
    var pb = p.playbook, sfh = isSFH(p), h = tabBar(state, p.id);
    h += '<div class="meta"><span>Playbook · updated '+esc(state.updated)+'</span></div>';
    h += '<div class="pb-head"><h1 style="font-size:clamp(1.8rem,4.5vw,2.6rem)">'+(p.rank?'<span class="rank" style="color:var(--accent)">#'+esc(p.rank)+'</span> ':'')+esc(p.addr)+'</h1><span class="cat '+(sfh?'sfh':'rent')+'">'+(sfh?'Single family':'Rental')+'</span></div>';
    h += '<p class="lede">'+esc(p.area)+' · '+esc(p.price)+(p.mls?' · MLS '+esc(p.mls):'')+' · '+esc(p.type)+(p.url?' · <a href="'+esc(p.url)+'">listing</a>':'')+'</p>';
    h += '<div class="pb-verdict'+(sfh?' sfh':'')+'"><strong>The plan.</strong> '+esc(pb.verdict)+'</div>';
    if(pb.gates && pb.gates.length){
      h += '<h2>What decides it, in order</h2><div class="pb-gates">';
      pb.gates.forEach(function(g,i){ h += '<div class="pb-gate"><span class="n">'+(i+1)+'</span><h4>'+esc(g.t)+'</h4><span class="who">'+esc(g.who||'')+'</span><p>'+esc(g.body)+'</p>'+(g.kill?'<p class="kill">Walk if: '+esc(g.kill)+'</p>':'')+'</div>'; });
      h += '</div>';
    }
    if(pb.numbers){
      h += '<h2>The monthly numbers</h2><div class="tblwrap"><table><tr>'+pb.numbers.head.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr>';
      pb.numbers.rows.forEach(function(r){ h += '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>'; });
      h += '</table></div>'+(pb.numbers.note?'<p class="small">'+esc(pb.numbers.note)+'</p>':'');
    }
    if(pb.offer && pb.offer.length) h += '<h2>The offer</h2><ul>'+pb.offer.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
    if(pb.ask && pb.ask.length) h += '<h2>Questions for the listing agent</h2><ol>'+pb.ask.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
    if(pb.avoid && pb.avoid.length) h += '<h2>What we won\'t do</h2><ul>'+pb.avoid.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
    h += '<p class="small" style="margin-top:28px">Research, not lending or legal advice. Zoning confirmed with the city, lending rules with the lender. <a href="#">← Back to the full list</a></p>';
    return h;
  }
  function view(state, editing){
    var props = state.props;
    var fresh = props.filter(function(p){return p.status==='new';});
    var active = props.filter(function(p){return p.status==='active';});
    var watching = props.filter(function(p){return p.status==='watching';});
    var dropped = props.filter(function(p){return p.status==='dropped';});
    var h = tabBar(state, '');
    h += '<div class="meta"><span>Buyer brief · updated '+esc(state.updated)+'</span><span class="tools"><button id="edit-btn" class="hidden">Edit</button><button id="save-btn" class="primary hidden">Save changes</button><button id="cancel-btn" class="hidden">Cancel</button><span class="status-msg" id="msg"></span></span></div>';
    h += '<h1>What I\'m looking for, Corey</h1>';
    h += '<p class="lede">This is my living list. I\'ll keep it current as we narrow in: new means my daily scan found it and I haven\'t looked yet, ranked means tour or make a call, watching means it needs an answer first, dropped stays at the bottom with the reason so you know I saw it.</p>';
    h += '<div class="update"><span class="k">Latest</span>'+(editing?'<textarea id="latest-edit">'+esc(state.latest)+'</textarea>':esc(state.latest))+'</div>';

    h += '<h2>The target</h2><div class="box"><dl class="kv">';
    h += '<dt>Property</dt><dd><strong>A legal 2–4 unit building I can live in one unit of.</strong> A cheap duplex or a 3–4 unit where two or three rents carry the payment both work. A house with a permitted basement apartment is the backup. I\'m also open to a plain single-family, 2bd+ with a yard and garage, if the payment works; those are rare under my number east of I-15, so flag anything you see.</dd>';
    h += '<dt>Must have</dt><dd>A yard and a garage (attached or detached); carports don\'t count. <strong>At least two bedrooms in the unit I live in</strong>, everywhere.</dd>';
    h += '<dt>Location</dt><dd>Within 20 minutes of my shop at 6092 S 900 E, Murray. East of I-15, inside the I-215 / I-80 belt: Murray, Midvale, Millcreek, Holladay, Cottonwood Heights, Sandy, South Salt Lake, Sugar House. Liberty Wells is the northern stretch.</dd>';
    h += '<dt>Monthly ceiling</dt><dd><strong>$2,500/month net after tenant rent, and cheaper is better.</strong> This is the number I\'m optimizing for.</dd>';
    h += '<dt>Price</dt><dd>What $2,500 net implies at today\'s FHA rates: <strong>≤ ~$530–580k for a duplex</strong> with one 2bd tenant at ~$1,600 (the higher end if the seller pays a point to buy the rate down), ≤ ~$610k if the tenant unit is a 3bd/2ba, or <strong>up to ~$750k for a 3–4 unit</strong> where I live in the smallest unit. I\'ll ask for the full 6% FHA seller credit on every offer: 3% for closing, the rest toward rate.</dd>';
    h += '<dt>Timing</dt><dd>Ready to tour now. Pre-approval letter within a couple of weeks.</dd></dl></div>';

    h += '<h2>How I\'m financing it, and what that means for offers</h2>';
    h += '<p>Owner-occupant <strong>FHA</strong> with the 3.5% covered by a down-payment-assistance second (Chenoa Fund or Utah Housing\'s DPA second). I\'d rather keep my cash as reserves. County and city grants are out; my income is over their 80% AMI limit.</p>';
    h += '<p>Chenoa and Utah Housing cap at 2 units; on a 3–4 unit it\'s plain FHA with my own 3.5% and FHA\'s self-sufficiency test (75% of all rents must cover the full payment). The lender counts 75% of a legal unit\'s market rent toward my income, which is what makes the approval work. A non-conforming basement apartment usually can\'t be counted.</p>';
    h += '<div class="box warm"><p><strong>Screen for these before we tour:</strong></p><ul>';
    h += '<li><strong>Seller accepts FHA.</strong> "Cash or conventional only" is a pass.</li>';
    h += '<li><strong>FHA appraisal condition.</strong> Pre-1940, peeling paint, roof life, knob-and-tube: anything that has failed an FHA appraisal before is a pass.</li>';
    h += '<li><strong>One unit vacant at closing.</strong> FHA needs me in within 60 days.</li>';
    h += '<li><strong>Seller credit.</strong> Up to 6% on FHA; I\'ll ask for all of it and trade price for credit.</li>';
    h += '<li><strong>Offer posture.</strong> I open aggressively, especially on anything past 60 days or with prior cuts, and I\'m fine being countered. Each card shows the open and the landing I\'d actually accept.</li>';
    h += '<li><strong>Legal unit.</strong> Separate meters, permitted, licensable.</li></ul></div>';

    h += '<h2>The list</h2>';
    h += section('New: waiting for Ben\'s eyes', fresh, editing, 'Found by my daily scan and not yet reviewed by me. Corey, feel free to weigh in, but don\'t chase these until I move them to Ranked or Watching.');
    h += section('Ranked', active, editing, 'In my order, ranked separately within rentals and single family. Rental #1 is the one I want to make work.');
    h += section('Watching / backups', watching, editing, 'Not ranked, but not dead. Each has one question that decides it.');
    h += section('Dropped', dropped, editing);

    h += '<h2>Already ruled out (so you can skip them)</h2><ul>';
    h += '<li><strong>Carports or no garage:</strong> 1893 E Wellington Cir (Holladay), 429 E 5600 S (Murray), 3965 S 1300 E and 3420 S 2000 E (Millcreek), 815 E Whitemaple Way, 1241 S 300 E, 285 E Vidas, 170 E Wentworth, 817 E Ramona, 1145 Kensington, 1418 E 3900 S, 3761 S 300 E, 644 S Grand, and every 4-plex I found in South Salt Lake, Sugar House, Liberty Wells and Ballpark (1012 S West Temple, 568 S 900 E, 119 E Leslie, McCall, Vidas, Welby, Edison).</li>';
    h += '<li><strong>Over budget or sold as a pair:</strong> 1761 + 1771 E Fort Union Blvd ($1.5M for both), 2358 E Gregson Ave ($1.2M), 3915 S Feramorz ($1.45M), 7667 S Birch St ($795k), 6824 S 700 E ($775k), 5313 S Alpine ($750k), 4520 S Julep ($689.9k), 27–29 E Main St Sandy ($689k, leased through 2027).</li>';
    h += '<li><strong>Not actually duplexes:</strong> 7353 S 700 E, 740 E Baker Dr, 7238 S 525 E, 4833 Arbor Cir are twin-homes or townhomes.</li>';
    h += '<li><strong>Too old or rough for FHA:</strong> 1631 S 500 E (1902 four-plex), 90 W 7500 S (1930).</li></ul>';

    h += '<h2>What I\'d like from you</h2><ol>';
    h += '<li><strong>Two MLS auto-searches:</strong> (a) 2-unit properties up to $600k, east of I-15 in zips 84105, 84106, 84107, 84109, 84115, 84117, 84121, 84124, 84047, 84070, 84094, any parking; (b) 3–4 unit up to $800k, same zips. Also: single-family 2bd+ with a garage and yard, same zips, up to ~$450k (and up to $560k if it has a rentable basement or ADU).</li>';
    h += '<li><strong>Agent-to-agent on the active list:</strong> FHA accepted? Current rents and lease end dates? Can one unit be delivered vacant? Any prior FHA appraisal? Each card\'s "Ask" line has the specific question.</li>';
    h += '<li><strong>Rent comps</strong> for 2bd/1ba and 3bd/2ba in Millcreek, Murray, Midvale, and Sugar House; the appraiser\'s market rent is what the lender uses.</li>';
    h += '<li><strong>A lender you trust</strong> who does both Utah Housing and Chenoa, so I can get two pre-approvals side by side.</li>';
    h += '<li><strong>Your read on non-conforming units</strong> and how Murray, Midvale, Millcreek, and SLC are treating them on licensing and HB 82 ADU permits.</li>';
    h += '<li><strong>Tours</strong> in ranked order. 1888 S 800 E first, and I\'d like to see it before we write anything.</li>';
    h += '<li><strong>Off-market and expired.</strong> Sub-$550k duplexes rarely last; if you can reach owners of tired 2–4 unit buildings in Murray, Midvale, and South Salt Lake, I\'m interested.</li>';
    h += '<li><strong>Buyer-agent agreement</strong> sorted before the first showing.</li></ol>';
    h += '<p class="sig">Thanks, man. Tell me what I\'ve got wrong.<br>Ben</p>';
    return h;
  }

  function fullDoc(state){
    var json = JSON.stringify(state).replace(/<\//g, '<\\/');
    return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buyer Brief for Corey</title>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">'
      + '<style id="css">' + CSS + '</style>'
      + '<script type="application/json" id="state">' + json + '<\/script>'
      + '</head><body><div id="app" class="page">' + view(state, false) + '</div>'
      + '<script id="app-js">' + JS + '<\/script></body></html>';
  }

  var app = document.getElementById('app');
  var editing = false;
  var artifact = null;

  function currentPB(){ var mm = /#pb=([\w-]+)/.exec(location.hash||''); if(!mm) return null; return STATE.props.filter(function(p){return p.id===mm[1] && p.playbook;})[0] || null; }
  function render(){
    var pbp = currentPB();
    if(pbp && !editing){ app.innerHTML = playbookView(STATE, pbp); window.scrollTo(0,0); return; }
    app.innerHTML = view(STATE, editing);
    var eb = document.getElementById('edit-btn'), sb = document.getElementById('save-btn'), cb = document.getElementById('cancel-btn');
    if(artifact){ eb.classList.toggle('hidden', editing); sb.classList.toggle('hidden', !editing); cb.classList.toggle('hidden', !editing); }
    eb.onclick = function(){ editing = true; render(); };
    cb.onclick = function(){ editing = false; render(); };
    sb.onclick = save;
  }

  function collect(){
    var next = JSON.parse(JSON.stringify(STATE));
    var latest = document.getElementById('latest-edit');
    if(latest) next.latest = latest.value.trim();
    Array.prototype.forEach.call(app.querySelectorAll('.prop'), function(card){
      var id = card.getAttribute('data-id');
      var p = next.props.filter(function(x){return x.id===id;})[0]; if(!p) return;
      var s = card.querySelector('[data-field="status"]'), n = card.querySelector('[data-field="note"]');
      if(s) p.status = s.value; if(n) p.note = n.value.trim();
    });
    next.updated = new Date().toISOString().slice(0,10);
    return next;
  }

  function save(){
    if(!artifact) return;
    var msg = document.getElementById('msg'), sb = document.getElementById('save-btn');
    var next = collect();
    sb.disabled = true; msg.textContent = 'Saving…';
    artifact.publish(fullDoc(next)).then(function(){ msg.textContent = 'Saved. Reloading…'; }).catch(function(e){
      var code = e && e.code;
      if(code === 'conflict'){ msg.textContent = 'Someone saved a newer version; reloading to it.'; return; }
      if(code === 'not_writer' || code === 'not_granted'){ artifact = null; editing = false; render(); document.getElementById('msg').textContent = 'Read-only view.'; return; }
      sb.disabled = false; msg.textContent = 'Could not save (' + (code || 'error') + '). Try again.';
    });
  }

  window.addEventListener('hashchange', function(){ render(); });
  render();
  if(window.claude && typeof window.claude.use === 'function'){
    window.claude.use('artifact').then(function(ns){ if(ns){ artifact = ns; render(); } }).catch(function(){});
  }
})();
</script>

</body></html>
