<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Buyer Brief for Corey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="css">
:root{
  --bg:#f4f5f1; --bg-2:#eaece6; --panel:#fbfbf8; --line:#d3d7cf; --line-2:#b9bfb4;
  --ink:#1c2528; --ink-2:#4a5559; --ink-3:#71807f;
  --accent:#1f6b66; --accent-ink:#fff; --accent-soft:#d9e9e5; --warm:#b07a1e; --warm-soft:#f3e6cc;
  --good:#2b7a3d; --good-soft:#dcefdf; --warn:#a4661a; --warn-soft:#f6e8d2; --bad:#a6362f; --bad-soft:#f4dcd9;
  --display:"Bricolage Grotesque","Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a1c; --bg-2:#1b2427; --panel:#1e282b; --line:#2e3b3e; --line-2:#425155;
  --ink:#e6ebe8; --ink-2:#b4c0bd; --ink-3:#83918f; --accent:#5fb8b0; --accent-ink:#0f1a19; --accent-soft:#1d3a38; --warm:#d9a44a; --warm-soft:#3a2e15;
  --good:#6fc384; --good-soft:#1c3323; --warn:#dca35a; --warn-soft:#3a2b14; --bad:#e2766c; --bad-soft:#3d1f1c;}}
:root[data-theme="dark"]{
  --bg:#131a1c; --bg-2:#1b2427; --panel:#1e282b; --line:#2e3b3e; --line-2:#425155;
  --ink:#e6ebe8; --ink-2:#b4c0bd; --ink-3:#83918f; --accent:#5fb8b0; --accent-ink:#0f1a19; --accent-soft:#1d3a38; --warm:#d9a44a; --warm-soft:#3a2e15;
  --good:#6fc384; --good-soft:#1c3323; --warn:#dca35a; --warn-soft:#3a2b14; --bad:#e2766c; --bad-soft:#3d1f1c;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.page{max-width:880px;margin:0 auto;padding:clamp(24px,5vw,56px) clamp(16px,4vw,40px) 64px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:800;margin:40px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
h3{font-size:1.05rem;font-weight:600;margin:18px 0 6px}
p{margin:0 0 .9em;max-width:70ch}
ul,ol{max-width:70ch;padding-left:1.25em;margin:0 0 .9em}
li{margin:.3em 0}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.lede{font-size:1.1rem;color:var(--ink-2);margin-top:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:14px 0}
.box.warm{border-left:3px solid var(--warm);background:var(--warm-soft)}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 16px;font-size:.98rem}
.kv dt{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-top:4px}
.kv dd{margin:0}
@media (max-width:600px){.kv{grid-template-columns:1fr}}
.update{border-left:3px solid var(--accent);padding:8px 14px;background:var(--accent-soft);border-radius:0 8px 8px 0;margin:14px 0;font-size:.98rem}
.update .k{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:2px}
/* property cards */
.props{display:flex;flex-direction:column;gap:12px;margin:10px 0 6px}
h4.subhead{font-family:var(--display);font-size:1rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:18px 0 0;padding:8px 14px;border-radius:8px 8px 0 0;display:flex;align-items:baseline;gap:10px}
h4.subhead span{text-transform:none;letter-spacing:0;font-family:var(--body);font-size:.85rem;font-weight:400;opacity:.85}
h4.subhead.rent{background:var(--accent);color:var(--accent-ink)}
h4.subhead.sfh{background:var(--warm);color:#fff}
.props.rent{border-left:4px solid var(--accent);padding-left:10px;margin-top:0}
.props.sfh{border-left:4px solid var(--warm);padding-left:10px;margin-top:0}
.cat{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-left:4px}
.cat.rent{background:var(--accent-soft);color:var(--accent)} .cat.sfh{background:var(--warm-soft);color:var(--warm)}
.prop{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.prop.dropped{opacity:.72}
.prop .head{grid-column:1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.prop .head h4{font-size:1.08rem}
.prop .head .rank{font-family:var(--mono);color:var(--accent);font-weight:500;margin-right:2px}
.prop .head .price{font-family:var(--mono);font-size:.95rem;font-variant-numeric:tabular-nums}
.prop .head .sub{color:var(--ink-3);font-size:.85rem}
.prop .pill{grid-column:2;grid-row:1;align-self:start;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.new{background:var(--accent-soft);color:var(--accent)} .pill.active{background:var(--good-soft);color:var(--good)} .pill.watching{background:var(--warn-soft);color:var(--warn)} .pill.dropped{background:var(--bad-soft);color:var(--bad)}
.prop .body{grid-column:1 / -1;font-size:.96rem;color:var(--ink-2)}
.prop .body p{margin:0 0 .5em;max-width:none}
.prop .body .lbl{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.prop .body .net{color:var(--ink);font-weight:600}
.prop .note{grid-column:1 / -1;background:var(--bg-2);border-radius:6px;padding:8px 12px;font-size:.93rem}
.prop .note .lbl{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:2px}
.prop .edit{grid-column:1 / -1;display:grid;grid-template-columns:160px 1fr;gap:8px;align-items:start;border-top:1px dashed var(--line-2);padding-top:10px;margin-top:4px}
.prop .edit select,.prop .edit textarea,#latest-edit{font-family:var(--body);font-size:.92rem;padding:6px 8px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);color:var(--ink);width:100%}
.prop .edit textarea,#latest-edit{min-height:58px;resize:vertical}
@media (max-width:600px){.prop .edit{grid-template-columns:1fr}}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font-family:var(--display);font-weight:600;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button:disabled{opacity:.5;cursor:default}
.status-msg{font-family:var(--mono);font-size:.72rem;color:var(--ink-3)}
.hidden{display:none!important}
.sig{margin-top:36px;color:var(--ink-2)}
@media print{body{background:#fff;color:#000;font-size:12pt}.page{max-width:none;padding:0}.box,.prop{break-inside:avoid}a{color:#000;text-decoration:none}h2{break-after:avoid}.tools,.edit{display:none!important}}
</style>
<script type="application/json" id="state">{"updated": "2026-09-10", "latest": "Sep 10 (evening): single-family ranking is in: #1 10282 S Zinnia Way, #2 1066 E Violet Cir, #3 53 E Redondo Ave. Rental ranking unchanged (1888 S 800 E is still the one). Opening offers on every card are deliberately aggressive with a stated landing. Corey, please confirm whether 310 E 6240 S already closed.", "props": [{"id": "800e-1888", "status": "active", "addr": "1888 S 800 E", "area": "Liberty Wells 84105", "price": "$735,000", "mls": "2179070", "url": "https://www.redfin.com/UT/Salt-Lake-City/1888-S-800-E-84105/home/91746553", "type": "Triplex", "facts": "1916 legal duplex (county has it as 1888–1890) plus an off-the-books basement unit. 4bd/1ba + two 1bd/1ba, 2 garage spaces off the Garfield alley, front and back yards. Owners since 2006, used as a single-family with an ADU. Newer roof, electrical, furnaces, water heaters, but \"needs substantial updating.\" Listed Dec 2025 at $749.9k, went pending in nine days, fell through, cut, pulled in April, relisted Aug 15 at $735k. County 2026 value $718.8k, Redfin estimate $723k.", "net": "Plan: FHA as an honest two-unit. I live in the 1bd with the basement as part of my unit and rent the 4bd (~$2,400; 84105–84115 4-bed asks run $1,850–2,950). At $699k with ~2.5 seller-paid points the payment is ≈ $4,817 and my net ≈ $2,417; at $715k ≈ $2,516. With a roommate in my own unit, ≈ $1,600–1,700.", "ask": "1) Why did the December contract fall through? If it was an appraisal, what exactly did it flag? 2) Parcel is zoned R-1-5000 (single-family) and county GIS shows 1 housing unit: does the seller have anything showing SLC recognizes it as a legal two-family (permits, license, city letter)? I'm emailing zoning@slcgov.com too. 3) Floor plan: which unit is upstairs, does the basement connect inside to the 1bd, where are the meters? 4) Will the seller accept FHA, a 6% credit, and a permitted decommission of the basement kitchen before appraisal? 5) Are any rents actual leases?", "offer": "Open at $665,000 with the full 6% credit (≈ $39.9k to closing + 2–3 discount points). Walk-away $715,000 with the credit. Contingencies: city confirmation of two legal units, FHA appraisal as a two-unit, inspection with sewer scope.", "note": "My #1. Deep dive 2026-09-10: the basement can never be a legal third unit (R-1-5000; SLC and Utah ADU rules only cover single-family homes), so it has to be genuinely part of my unit. That's fine for me since I want two bedrooms of space. If the city says the duplex isn't legally recognized, the plan changes. I have a full deal playbook with the numbers and can walk you through it.", "rank": 1}, {"id": "6240s", "status": "active", "addr": "310 E 6240 S", "area": "Murray 84107", "price": "$735,000", "mls": "2164458", "url": "https://www.utahrealestate.com/2164458", "type": "Triplex (legally SFR)", "facts": "2bd up, 2bd down, and a detached 1bd ADU, rents $1,745 / $1,550 / $1,450 ($4,745 total), attached 1-car garage, 1968, landscaped with mature trees. Two minutes from the shop. Under contract, accepting backup offers. Legally a single-family residence.", "net": "I'd take one of the 2bd units and rent the other 2bd plus the ADU (≈ $3,000). Real net ≈ $2,000–2,500 depending on rate. The problem is qualifying: because it's legally a single-family, FHA's $637k 1-unit limit is out, it's conventional 3–5% down, and the lender will count at most one ADU's rent. I'm confirming with a lender whether my income supports it at $735k.", "ask": "1) Is the current contract solid, and would the seller take a backup? 2) Has the city ever recognized the second unit or the ADU (any permit, rental license, or separate meters)? 3) Would the seller consider carrying a second (seller financing) to bridge the gap?", "offer": "Backup only, if it isn't already closed: $660,000 (90%) with 6% credit. Assessor has it at $557k.", "note": "Beautiful and two minutes from work, so I want to try. Realistic routes: a co-borrower, or the price landing near $650k, or the seller carrying part of it. If none of those are possible I'll let it go. 2026-09-10: Redfin shows the companion MLS #2164460 for this address SOLD on Sept 2 (price withheld), so it has probably already closed and the 'backup offers' status is stale. Corey, please confirm. If it's gone, I'll drop it.", "rank": 2}, {"id": "driggs", "status": "active", "addr": "1252 E Driggs Ave", "area": "Sugar House 84106", "price": "$599,900", "mls": "2181877", "url": "https://www.redfin.com/UT/Salt-Lake-City/1252-E-Driggs-Ave-84106/home/91750169", "type": "Duplex (up/down)", "facts": "Legal non-conforming, 1948, detached 2-car garage, large backyard, separate meters, two furnaces, new sewer line. 12 days. 12 min.", "net": "With the 1bd basement renting ~$1,300, net lands near $2,800 even with a seller-paid buydown, ≈ $3,100 without. It gets to $2,500 with a roommate in my unit, a price near $545k, or a stronger basement rent.", "ask": "Is the lower unit licensed with SLC as a rental, and what has it rented for? Would the seller do a 6% credit at $599.9k, or a price cut to the mid-$500s? Any FHA appraisal history?", "offer": "Open at $535,000 (89%) with 6% credit; seller nets ≈ $503k. Marketed since Nov 2025 from $659.9k, four cuts, day count reset Aug 28, Redfin $594.7k, county $498.5k. A cost-conscious discount-brokerage seller who has chased the market for ten months. Comfortable landing: $564k with the credit.", "note": "I like this one: it lives like a house in Sugar House with a detached 2-car garage and a real backyard. New listing (12 days) so probably less room right now. 2026-09-10: the '12 days' is a relist mask. Cumulative ≈ 290 days, four price cuts. There is real room here.", "rank": 3}, {"id": "7670", "status": "active", "addr": "473 E 7670 S", "area": "Midvale 84047", "price": "$599,000", "mls": "2179007", "url": "https://www.redfin.com/UT/Midvale/473-E-7670-S-84047/home/91815350", "type": "Duplex", "facts": "1978, ~2,540 sf, 5bd/4ba total, garage and fully fenced yard per unit. 5 min from the shop. One side updated and vacant-able, the other month-to-month (long-term tenant open to a new lease). Cut from $619.5k to $599k on Sep 9, 27 days on market.", "net": "Works only if the tenant side is the bigger unit at $2,100+. The $20.5k cut takes about $145/mo off the payment ($20.5k × 0.965 × 1.0175 financed MIP = $20.1k less loan × 0.00622 at 6.35% ≈ $125 P&I, plus ≈ $10 tax and ≈ $9 MIP): ≈ $2,505, or ≈ $2,130 with a buydown.", "ask": "Exact unit split (beds/baths per side) and what the tenant side rents for.", "offer": "Open at $555,000 (92.7%) with 6% credit; seller nets ≈ $522k. Least room on the list: only 26 days, and Redfin ($610k) and county ($604k) sit above the ask. The trust seller and 'priced to sell' language are the opening. Landing: $563–575k with the credit.", "note": "Moved up to #4. Five minutes from the shop with a garage and fenced yard per side. Need the unit split and the tenant side's rent before it's a real candidate. 2026-09-10: cut to $599k (−$20.5k); that puts it right at my $2,500 line if the tenant side rents $2,100+.", "rank": 4}, {"id": "1000e-7795", "status": "active", "addr": "7795 S 1000 E", "area": "Midvale 84047", "price": "$515,400", "mls": "2144689", "url": "https://www.redfin.com/UT/Midvale/7795-S-1000-E-84047/home/91814642", "type": "House + basement unit", "facts": "1968, attached 2-car garage, attached 2bd/1ba unit with its own kitchen and entrance, rented at $1,400, 151 days on market. 6 min.", "net": "≈ $2,390 with the existing tenant.", "ask": "Is the unit permitted with Midvale? If yes, the rent counts toward my approval and this jumps to the top of the house list.", "offer": "Open at $455,000 (88%) with 6% credit; seller nets ≈ $428k. Six cuts from $590k, a living-trust seller, and a contract that died in August. Redfin $508k, county $504.5k. Landing: $479k with the credit.", "note": "If Midvale confirms the unit is permitted, this is the easiest deal on the list: existing $1,400 tenant, net ≈ $2,390, 151 days on market. 2026-09-10: went contingent Aug 10 and fell through Aug 17, then cut again to $515.4k. Trust-owned. Real motivation.", "rank": 5}, {"id": "hampton-143", "status": "active", "addr": "143 E Hampton Ave", "area": "Liberty Wells 84115", "price": "$500,000", "mls": "2164670", "url": "https://www.utahrealestate.com/2164670", "type": "House + basement suite", "facts": "Rebuilt to the studs, 1921, detached garage, walkout \"second full suite\" marketed as a house hack, 90 days. Tiny 0.07 ac lot.", "net": "≈ $2,175–2,475 if the suite has a kitchen (not stated).", "ask": "Does the suite have a kitchen and its own entrance? Permitted?", "offer": "Open at $440,000 (88%) with 6% credit; seller nets ≈ $414k. A flip bought for ~$304k in March 2025, eight cuts since October, stalled since Aug 18, county $353.5k. The FHA appraisal will drag the price anyway. Landing: $470k with the credit.", "note": "Small lot, but rebuilt to the studs at $500k. Need to know if the suite has a kitchen.", "rank": 6}, {"id": "zinnia-10282", "status": "active", "addr": "10282 S Zinnia Way", "area": "Sandy 84094", "price": "$415,000", "mls": "2180131", "url": "https://www.redfin.com/UT/White-City/10282-S-Zinnia-Way-84094/home/91840898", "type": "Single-family", "facts": "1959 rambler, 3bd/1ba, 1,026 sf, slab (no basement), attached 1-car garage with opener, fully fenced 0.19 ac lot with mature trees and RV parking. 21 days. ~11 min (estimated).", "net": "No tenant: $415k × 0.965 × 1.0175 = $407.5k loan → P&I ≈ $2,535 + MIP ≈ $184 + tax ≈ $208 + insurance ≈ $180 = ≈ $3,107/mo. About $600 over my line.", "ask": "Seller credit or a buydown on the table?", "offer": "Open at $390,000 (94%) with 6% credit toward a rate buydown. Only 21 days, so modest room; the credit matters more than the price here.", "note": "Ben reviewed 2026-09-10: ranked. Payment (~$3,100 with no tenant) is the hurdle, so a seller credit toward a buydown matters here.", "rank": 1}, {"id": "violet-1066", "status": "active", "addr": "1066 E Violet Cir", "area": "Sandy 84094", "price": "$439,000", "mls": "2172581", "url": "https://www.redfin.com/UT/White-City/1066-E-Violet-Cir-84094/home/86482622", "type": "Single-family", "facts": "1975, 2bd/1ba, 901 sf, no basement, detached 1-car garage with opener, large yard on a cul-de-sac with mature trees. Price already reduced; 55 days. ~11 min (estimated).", "net": "No tenant: $439k × 0.965 × 1.0175 = $431.0k loan → P&I ≈ $2,682 + MIP ≈ $194 + tax ≈ $220 + insurance ≈ $180 = ≈ $3,276/mo. About $775 over my line.", "ask": "Where will the seller land after 55 days and a cut? Credit toward a buydown?", "offer": "Open at $400,000 (91%) with 6% credit toward a buydown. Already reduced, 55 days.", "note": "Ben reviewed 2026-09-10: ranked. Already reduced and 55 days; ask about a credit toward a buydown.", "rank": 2}, {"id": "redondo-53", "status": "active", "addr": "53 E Redondo Ave", "area": "South Salt Lake line 84115", "price": "$450,000", "mls": "2162522", "url": "https://www.redfin.com/UT/Salt-Lake-City/53-E-Redondo-Ave-84115/home/86428735", "type": "Single-family", "facts": "1919 Craftsman bungalow, 2bd/1ba, 984 sf on 0.07 ac, fully updated (newer roof, sewer line, water heater, radon mitigation), detached heated 1-car garage with workshop, fully fenced secluded yard with deck, pergola and outdoor kitchen. 99 days. Listing says it qualifies for Zions Bank's CRA loan (3% down, lender-paid PMI). ~14 min (estimated).", "net": "FHA, no tenant: $450k × 0.965 × 1.0175 = $441.8k loan → P&I ≈ $2,749 + MIP ≈ $199 + tax ≈ $225 + insurance ≈ $180 = ≈ $3,353/mo. About $850 over my line.", "ask": "Where will the seller go after 99 days, and would they pay points? Worth pricing the Zions CRA loan against FHA.", "offer": "Open at $410,000 (91%) with 6% credit toward a buydown. 99 days; also worth pricing the Zions CRA loan the listing mentions.", "note": "Ben reviewed 2026-09-10: great house, not a great location, but OK for now. 99 days; ask where the seller will land and whether they'd pay points.", "rank": 3}, {"id": "2700s-829", "status": "watching", "addr": "829 E 2700 S", "area": "Sugar House line 84106", "price": "$543,000", "mls": "2140639", "url": "https://www.utahrealestate.com/2140639", "type": "House + basement unit", "facts": "Rehabbed 1949, detached garage, fenced yard, attached 2bd/1ba unit with kitchen and separate entrance, not rented, 301 days on market.", "net": "$2,490–2,790 at $1,200–1,500 rent. Works only with a real price cut.", "ask": "What's the story behind 301 days?", "offer": "Open at $470,000 (86.6%) with 6% credit; seller nets ≈ $442k. Eleven months cumulative, fourteen $500 micro-cuts, owner appears to be the listing agent (no second commission to pay). Landing: $500k with the credit.", "note": "OK, not exciting. Only with a real price cut off 301 days."}, {"id": "hampton-352", "status": "watching", "addr": "352 E Hampton Ave", "area": "Central City 84111", "price": "$699,900", "mls": "2141619", "url": "https://www.redfin.com/UT/Salt-Lake-City/352-E-Hampton-Ave-84111/home/91738513", "type": "Triplex", "facts": "Legal non-conforming duplex plus a 399 sf third unit, 1897, detached garage that rents for $350, 0.24 ac. Stated rents $2,295 and $1,535. 187 days on market. 17 min from the shop.", "net": "≈ $1,070 if I take the small unit. Best number in the valley on paper.", "ask": "Can it pass an FHA appraisal? What will the seller actually take after 187 days? Is the third unit licensed?", "offer": "Open at $610,000 (87%) with 6% credit; seller nets ≈ $573k. LLC seller cutting ~$25k every five weeks from $825k, Redfin $673.7k, next cut due late September. Landing: $644k with the credit.", "note": "Backup. Best net on paper but 1897 and 17 minutes; I'd rather make 1888 S 800 E work."}, {"id": "malvern-89", "status": "dropped", "addr": "89 W Malvern Ave", "area": "South Salt Lake 84115", "price": "$369,999", "mls": "2184292", "url": "https://www.redfin.com/UT/South-Salt-Lake/89-W-Malvern-Ave-84115/home/86406415", "type": "House + basement unit", "facts": "1956, 3bd/2ba, 1,716 sf on 0.14 ac. Main floor 2bd/1ba; 95%-finished walkout basement with its own kitchen, 1bd/1ba, family room and laundry behind a separate entrance. Detached 2-car tandem garage, fully fenced lot, covered patio. Sold as-is (fixer). Listed Sep 9. West of State St near I-15, ~12 min from the shop (estimated).", "net": "FHA 3.5% at 6.35%: $369,999 × 0.965 = $357.0k + 1.75% UFMIP = $363.3k loan → P&I ≈ $2,261 + MIP ≈ $164 + tax ≈ $185 + insurance ≈ $180 = ≈ $2,789. Minus a $1,000–1,200 basement rent (my estimate, unverified) ≈ $1,590–1,790 net. The unit's legal status is unknown, so the lender wouldn't count that rent.", "ask": "What does as-is cover (roof, furnace, sewer, known defects)? Would it pass an FHA appraisal as-is, or does it need a 203(k)? Is the basement unit permitted or registered with South Salt Lake? Seller open to FHA and a credit?", "offer": "", "note": "Dropped 2026-09-10: Ben passed. No thanks."}, {"id": "murray-2166818", "status": "dropped", "addr": "Undisclosed address, Murray", "area": "Murray 84107", "price": "$415,000", "mls": "2166818", "url": "https://www.redfin.com/UT/Murray/Undisclosed-address-84107/home/91789779", "type": "Single-family", "facts": "1950, 3bd/2ba, 1,145 sf, oversized attached 2-car garage, all yards fenced, double driveway plus a gated back drive to a city-park lot (RV/trailer parking), paid-off solar, updated electrical and windows. Seller withheld the address; the map pin is between State St and I-15 about 1.5 mi west of the shop (~5 min, estimated). 36 days.", "net": "No tenant: $415k × 0.965 × 1.0175 = $407.5k loan → P&I ≈ $2,535 + MIP ≈ $184 + tax ≈ $208 + insurance ≈ $180 = ≈ $3,107/mo. About $600 over my line.", "ask": "What's the address, and why is it withheld (tenant, estate)? Room on price after 36 days?", "offer": "", "note": "Dropped 2026-09-10: Ben passed."}, {"id": "first-488w", "status": "dropped", "addr": "488 W 1st Ave", "area": "Midvale 84047", "price": "$430,000", "mls": "2182932", "url": "https://www.redfin.com/UT/Midvale/488-W-1st-Ave-84047/home/91790199", "type": "Single-family", "facts": "1912, 3bd/2ba, 1,779 sf, updated kitchen, detached 2-car garage with opener, fully fenced secluded yard with mature trees and sprinklers. Sold as-is. 7 days. Old Midvale just east of I-15, ~8 min (estimated).", "net": "No tenant: $430k × 0.965 × 1.0175 = $422.2k loan → P&I ≈ $2,627 + MIP ≈ $190 + tax ≈ $215 + insurance ≈ $180 = ≈ $3,212/mo. About $700 over my line.", "ask": "Why as-is? Anything a 1912 house would fail on an FHA appraisal (paint, roof, wiring)?", "offer": "", "note": "Dropped 2026-09-10: Ben passed."}, {"id": "rose-garden", "status": "dropped", "addr": "4358 S Rose Garden Ln", "area": "Millcreek 84124", "price": "$559,000", "mls": "2173815", "url": "https://www.redfin.com/UT/Salt-Lake-City/4358-S-Rose-Garden-Ln-84124/home/91858130", "type": "Duplex", "facts": "Brick side-by-side 2 × 2bd/1ba, 1954, 2-car garage, own fenced yard each side, cul-de-sac. 8 min from the shop. New electrical/AC 2023, roof 2017. Both sides long-term tenants (7 and 5 years). Seller financing offered.", "net": "≈ $2,500 with my own 3.5% down, ≈ $2,365 with a seller-paid point, under $2,200 with both.", "ask": "Will the seller deliver one side vacant? Current rents and lease terms? Any prior FHA appraisal?", "offer": "", "note": "Dropped: I'm out on this one."}, {"id": "10600s", "status": "dropped", "addr": "804 E 10600 S", "area": "Sandy 84094", "price": "$469,000", "mls": "", "url": "https://www.redfin.com/UT/Sandy/804-E-10600-S-84094/home/91841457", "type": "Duplex (non-conforming)", "facts": "2 × 2bd/1ba, 1952, detached garage, mostly fenced yard. Rents $2,090 total (about $1,045 a side, below market), sold with tenants. Furnace ~56 years old, no showings before an accepted offer. 11 min.", "net": "≈ $2,470 at current rent, ≈ $1,920 if the other side re-leases at market.", "ask": "Is an offer contingent on inspection realistic given \"no showings\"? Will the lender count rent on a non-conforming unit?", "offer": "", "note": "Dropped: 10600 South is too busy a road."}, {"id": "700e-4401", "status": "dropped", "addr": "4401 S 700 E", "area": "Millcreek 84107", "price": "$599,000", "mls": "2165168", "url": "https://www.redfin.com/UT/Millcreek/4401-S-700-E-84107/home/91799605", "type": "Duplex", "facts": "Remodeled 2 × 2bd up/down, 1924, oversized garage with 220V, xeriscaped yard, rents $3,025 total, 89 days. 7 min. Fronts busy 700 E.", "net": "≈ $2,550–2,650 with a buydown, so close.", "ask": "Any FHA appraisal history on a 1924 building? Lease terms?", "offer": "", "note": "Dropped: the yard is rock, not a yard."}, {"id": "fenton", "status": "dropped", "addr": "332 E Fenton Ave", "area": "South Salt Lake 84115", "price": "$759,000", "mls": "2183415", "url": "https://www.redfin.com/UT/South-Salt-Lake/332-E-Fenton-Ave-84115/home/86488451", "type": "Duplex", "facts": "1988, 2 × 3bd/2.5ba, 2-car garage and private yard per unit, $2,320 each, both leased through Aug 2027. 9 min.", "net": "Above my band, and the leases block FHA occupancy.", "ask": "Would the seller negotiate one tenant out? Only then is this interesting.", "offer": "", "note": "Dropped: too big for what I want, and both units are leased through 2027."}, {"id": "lambourne", "status": "dropped", "addr": "458 E Lambourne Ave", "area": "South Salt Lake 84115", "price": "$650,000", "mls": "2143211", "url": "https://www.redfin.com/UT/South-Salt-Lake/458-E-Lambourne-Ave-84115/home/86434133", "type": "Duplex", "facts": "2022 gut remodel, 1-car garage per unit, fenced yards, 180 days.", "net": "≈ $3,350.", "ask": "", "offer": "", "note": "Over my monthly number unless I take a roommate. Keeping it here only so you know I saw it."}]}</script>
</head><body>
<div id="app" class="page"></div>
<script id="app-js">
(function(){
  var stateEl = document.getElementById('state');
  var STATE = JSON.parse(stateEl.textContent);
  var CSS = document.getElementById('css').textContent;
  var JS = document.getElementById('app-js').textContent;
  var esc = function(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var LABEL = {new:'New', active:'Active', watching:'Watching', dropped:'Dropped'};

  function propCard(p, editing){
    var h = '<div class="prop '+esc(p.status)+'" data-id="'+esc(p.id)+'">';
    h += '<div class="head"><h4>'+(p.rank?'<span class="rank">#'+esc(p.rank)+'</span> ':'')+(p.url?'<a href="'+esc(p.url)+'">'+esc(p.addr)+'</a>':esc(p.addr))+'</h4><span class="price">'+esc(p.price)+'</span><span class="sub">'+esc(p.area)+(p.mls?' · MLS '+esc(p.mls):'')+' · '+esc(p.type)+'</span><span class="cat '+(isSFH(p)?'sfh':'rent')+'">'+(isSFH(p)?'Single family':'Rental')+'</span></div>';
    h += '<span class="pill '+esc(p.status)+'">'+esc(LABEL[p.status]||p.status)+'</span>';
    h += '<div class="body"><p>'+esc(p.facts)+'</p>';
    if(p.net) h += '<p><span class="lbl">Monthly</span><span class="net">'+esc(p.net)+'</span></p>';
    if(p.offer) h += '<p><span class="lbl">Opening offer</span>'+esc(p.offer)+'</p>';
    if(p.ask) h += '<p><span class="lbl">Ask</span>'+esc(p.ask)+'</p>';
    h += '</div>';
    if(p.note) h += '<div class="note"><span class="lbl">Note</span>'+esc(p.note)+'</div>';
    if(editing){
      h += '<div class="edit"><select data-field="status">';
      ['new','active','watching','dropped'].forEach(function(s){ h += '<option value="'+s+'"'+(p.status===s?' selected':'')+'>'+LABEL[s]+'</option>'; });
      h += '</select><textarea data-field="note" placeholder="Note for Corey (why it moved, what we learned)">'+esc(p.note)+'</textarea></div>';
    }
    return h+'</div>';
  }

  function isSFH(p){ return /^single-family/i.test(p.type||''); }
  function section(title, list, editing, intro){
    if(!list.length) return '';
    var rentals = list.filter(function(p){return !isSFH(p);}), sfh = list.filter(isSFH);
    var h = '<h3>'+title+'</h3>'+(intro?'<p>'+intro+'</p>':'');
    if(rentals.length) h += '<h4 class="subhead rent">Rentals <span>duplex, triplex, or a house with a rentable unit</span></h4><div class="props rent">'+rentals.map(function(p){return propCard(p, editing);}).join('')+'</div>';
    if(sfh.length) h += '<h4 class="subhead sfh">Single family <span>plain house, no second unit</span></h4><div class="props sfh">'+sfh.map(function(p){return propCard(p, editing);}).join('')+'</div>';
    return h;
  }

  function view(state, editing){
    var props = state.props;
    var fresh = props.filter(function(p){return p.status==='new';});
    var active = props.filter(function(p){return p.status==='active';});
    var watching = props.filter(function(p){return p.status==='watching';});
    var dropped = props.filter(function(p){return p.status==='dropped';});
    var h = '';
    h += '<div class="meta"><span>Buyer brief · updated '+esc(state.updated)+'</span><span class="tools"><button id="edit-btn" class="hidden">Edit</button><button id="save-btn" class="primary hidden">Save changes</button><button id="cancel-btn" class="hidden">Cancel</button><span class="status-msg" id="msg"></span></span></div>';
    h += '<h1>What I\'m looking for, Corey</h1>';
    h += '<p class="lede">This is my living list. I\'ll keep it current as we narrow in: new means my daily scan found it and I haven\'t looked yet, ranked means tour or make a call, watching means it needs an answer first, dropped stays at the bottom with the reason so you know I saw it.</p>';
    h += '<div class="update"><span class="k">Latest</span>'+(editing?'<textarea id="latest-edit">'+esc(state.latest)+'</textarea>':esc(state.latest))+'</div>';

    h += '<h2>The target</h2><div class="box"><dl class="kv">';
    h += '<dt>Property</dt><dd><strong>A legal 2–4 unit building I can live in one unit of.</strong> A cheap duplex or a 3–4 unit where two or three rents carry the payment both work. A house with a permitted basement apartment is the backup. I\'m also open to a plain single-family, 2bd+ with a yard and garage, if the payment works; those are rare under my number east of I-15, so flag anything you see.</dd>';
    h += '<dt>Must have</dt><dd>A yard and a garage (attached or detached). Carports don\'t count.</dd>';
    h += '<dt>Location</dt><dd>Within 20 minutes of my shop at 6092 S 900 E, Murray. East of I-15, inside the I-215 / I-80 belt: Murray, Midvale, Millcreek, Holladay, Cottonwood Heights, Sandy, South Salt Lake, Sugar House. Liberty Wells is the northern stretch.</dd>';
    h += '<dt>Monthly ceiling</dt><dd><strong>$2,500/month net after tenant rent, and cheaper is better.</strong> This is the number I\'m optimizing for.</dd>';
    h += '<dt>Price</dt><dd>What $2,500 net implies at today\'s FHA rates: <strong>≤ ~$530–580k for a duplex</strong> with one 2bd tenant at ~$1,600 (the higher end if the seller pays a point to buy the rate down), ≤ ~$610k if the tenant unit is a 3bd/2ba, or <strong>up to ~$750k for a 3–4 unit</strong> where I live in the smallest unit. I\'ll ask for the full 6% FHA seller credit on every offer: 3% for closing, the rest toward rate.</dd>';
    h += '<dt>Timing</dt><dd>Ready to tour now. Pre-approval letter within a couple of weeks.</dd></dl></div>';

    h += '<h2>How I\'m financing it, and what that means for offers</h2>';
    h += '<p>Owner-occupant <strong>FHA</strong> with the 3.5% covered by a down-payment-assistance second (Chenoa Fund or Utah Housing\'s DPA second). I\'d rather keep my cash as reserves. County and city grants are out; my income is over their 80% AMI limit.</p>';
    h += '<p>Chenoa and Utah Housing cap at 2 units; on a 3–4 unit it\'s plain FHA with my own 3.5% and FHA\'s self-sufficiency test (75% of all rents must cover the full payment). The lender counts 75% of a legal unit\'s market rent toward my income, which is what makes the approval work. A non-conforming basement apartment usually can\'t be counted.</p>';
    h += '<div class="box warm"><p><strong>Screen for these before we tour:</strong></p><ul>';
    h += '<li><strong>Seller accepts FHA.</strong> "Cash or conventional only" is a pass.</li>';
    h += '<li><strong>FHA appraisal condition.</strong> Pre-1940, peeling paint, roof life, knob-and-tube: anything that has failed an FHA appraisal before is a pass.</li>';
    h += '<li><strong>One unit vacant at closing.</strong> FHA needs me in within 60 days.</li>';
    h += '<li><strong>Seller credit.</strong> Up to 6% on FHA; I\'ll ask for all of it and trade price for credit.</li>';
    h += '<li><strong>Offer posture.</strong> I open aggressively, especially on anything past 60 days or with prior cuts, and I\'m fine being countered. Each card shows the open and the landing I\'d actually accept.</li>';
    h += '<li><strong>Legal unit.</strong> Separate meters, permitted, licensable.</li></ul></div>';

    h += '<h2>The list</h2>';
    h += section('New: waiting for Ben\'s eyes', fresh, editing, 'Found by my daily scan and not yet reviewed by me. Corey, feel free to weigh in, but don\'t chase these until I move them to Ranked or Watching.');
    h += section('Ranked', active, editing, 'In my order, ranked separately within rentals and single family. Rental #1 is the one I want to make work.');
    h += section('Watching / backups', watching, editing, 'Not ranked, but not dead. Each has one question that decides it.');
    h += section('Dropped', dropped, editing);

    h += '<h2>Already ruled out (so you can skip them)</h2><ul>';
    h += '<li><strong>Carports or no garage:</strong> 1893 E Wellington Cir (Holladay), 429 E 5600 S (Murray), 3965 S 1300 E and 3420 S 2000 E (Millcreek), 815 E Whitemaple Way, 1241 S 300 E, 285 E Vidas, 170 E Wentworth, 817 E Ramona, 1145 Kensington, 1418 E 3900 S, 3761 S 300 E, 644 S Grand, and every 4-plex I found in South Salt Lake, Sugar House, Liberty Wells and Ballpark (1012 S West Temple, 568 S 900 E, 119 E Leslie, McCall, Vidas, Welby, Edison).</li>';
    h += '<li><strong>Over budget or sold as a pair:</strong> 1761 + 1771 E Fort Union Blvd ($1.5M for both), 2358 E Gregson Ave ($1.2M), 3915 S Feramorz ($1.45M), 7667 S Birch St ($795k), 6824 S 700 E ($775k), 5313 S Alpine ($750k), 4520 S Julep ($689.9k), 27–29 E Main St Sandy ($689k, leased through 2027).</li>';
    h += '<li><strong>Not actually duplexes:</strong> 7353 S 700 E, 740 E Baker Dr, 7238 S 525 E, 4833 Arbor Cir are twin-homes or townhomes.</li>';
    h += '<li><strong>Too old or rough for FHA:</strong> 1631 S 500 E (1902 four-plex), 90 W 7500 S (1930).</li></ul>';

    h += '<h2>What I\'d like from you</h2><ol>';
    h += '<li><strong>Two MLS auto-searches:</strong> (a) 2-unit properties up to $600k, east of I-15 in zips 84105, 84106, 84107, 84109, 84115, 84117, 84121, 84124, 84047, 84070, 84094, any parking; (b) 3–4 unit up to $800k, same zips. Also: single-family 2bd+ with a garage and yard, same zips, up to ~$450k (and up to $560k if it has a rentable basement or ADU).</li>';
    h += '<li><strong>Agent-to-agent on the active list:</strong> FHA accepted? Current rents and lease end dates? Can one unit be delivered vacant? Any prior FHA appraisal? Each card\'s "Ask" line has the specific question.</li>';
    h += '<li><strong>Rent comps</strong> for 2bd/1ba and 3bd/2ba in Millcreek, Murray, Midvale, and Sugar House; the appraiser\'s market rent is what the lender uses.</li>';
    h += '<li><strong>A lender you trust</strong> who does both Utah Housing and Chenoa, so I can get two pre-approvals side by side.</li>';
    h += '<li><strong>Your read on non-conforming units</strong> and how Murray, Midvale, Millcreek, and SLC are treating them on licensing and HB 82 ADU permits.</li>';
    h += '<li><strong>Tours</strong> in ranked order. 1888 S 800 E first, and I\'d like to see it before we write anything.</li>';
    h += '<li><strong>Off-market and expired.</strong> Sub-$550k duplexes rarely last; if you can reach owners of tired 2–4 unit buildings in Murray, Midvale, and South Salt Lake, I\'m interested.</li>';
    h += '<li><strong>Buyer-agent agreement</strong> sorted before the first showing.</li></ol>';
    h += '<p class="sig">Thanks, man. Tell me what I\'ve got wrong.<br>Ben</p>';
    return h;
  }

  function fullDoc(state){
    var json = JSON.stringify(state).replace(/<\//g, '<\\/');
    return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buyer Brief for Corey</title>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">'
      + '<style id="css">' + CSS + '</style>'
      + '<script type="application/json" id="state">' + json + '<\/script>'
      + '</head><body><div id="app" class="page">' + view(state, false) + '</div>'
      + '<script id="app-js">' + JS + '<\/script></body></html>';
  }

  var app = document.getElementById('app');
  var editing = false;
  var artifact = null;

  function render(){
    app.innerHTML = view(STATE, editing);
    var eb = document.getElementById('edit-btn'), sb = document.getElementById('save-btn'), cb = document.getElementById('cancel-btn');
    if(artifact){ eb.classList.toggle('hidden', editing); sb.classList.toggle('hidden', !editing); cb.classList.toggle('hidden', !editing); }
    eb.onclick = function(){ editing = true; render(); };
    cb.onclick = function(){ editing = false; render(); };
    sb.onclick = save;
  }

  function collect(){
    var next = JSON.parse(JSON.stringify(STATE));
    var latest = document.getElementById('latest-edit');
    if(latest) next.latest = latest.value.trim();
    Array.prototype.forEach.call(app.querySelectorAll('.prop'), function(card){
      var id = card.getAttribute('data-id');
      var p = next.props.filter(function(x){return x.id===id;})[0]; if(!p) return;
      var s = card.querySelector('[data-field="status"]'), n = card.querySelector('[data-field="note"]');
      if(s) p.status = s.value; if(n) p.note = n.value.trim();
    });
    next.updated = new Date().toISOString().slice(0,10);
    return next;
  }

  function save(){
    if(!artifact) return;
    var msg = document.getElementById('msg'), sb = document.getElementById('save-btn');
    var next = collect();
    sb.disabled = true; msg.textContent = 'Saving…';
    artifact.publish(fullDoc(next)).then(function(){ msg.textContent = 'Saved. Reloading…'; }).catch(function(e){
      var code = e && e.code;
      if(code === 'conflict'){ msg.textContent = 'Someone saved a newer version; reloading to it.'; return; }
      if(code === 'not_writer' || code === 'not_granted'){ artifact = null; editing = false; render(); document.getElementById('msg').textContent = 'Read-only view.'; return; }
      sb.disabled = false; msg.textContent = 'Could not save (' + (code || 'error') + '). Try again.';
    });
  }

  render();
  if(window.claude && typeof window.claude.use === 'function'){
    window.claude.use('artifact').then(function(ns){ if(ns){ artifact = ns; render(); } }).catch(function(){});
  }
})();
</script>

</body></html>
